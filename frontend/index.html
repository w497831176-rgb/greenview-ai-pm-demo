            </div>
          </div>
          <div class="rounded-2xl border border-indigo-200 bg-indigo-50 p-4 text-sm text-indigo-950"><b>版本关系：</b>Draft 保存 Agent / Skill / RAG / MCP 的待发布配置；发布后生成唯一当前生效 RuntimeRelease，仅对下一新会话生效。v18、v19、v27 等都是不可变历史快照，只供追溯、比较或人工回滚。</div>
          <div id="runtime-content">${loadingState()}</div>
        </div>`;

      let overview = null;

      const changeLabels = {
        added: '新增',
        modified: '修改',
        disabled: '停用',
        deleted: '删除'
      };

      const changeStyles = {
        added: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        modified: 'bg-indigo-50 text-indigo-700 border-indigo-200',
        disabled: 'bg-amber-50 text-amber-700 border-amber-200',
        deleted: 'bg-red-50 text-red-700 border-red-200'
      };

      const displayDiffValue = value => {
        if (value && typeof value === 'object' && Object.prototype.hasOwnProperty.call(value, 'preview')) {
          return `${value.preview || '（空）'}${value.truncated ? ` …（共 ${value.length} 字）` : ''}`;
        }
        if (value === null || value === undefined || value === '') return '（空）';
        if (typeof value === 'boolean') return value ? '启用' : '停用';
        if (typeof value === 'object') return JSON.stringify(value, null, 2);
        return String(value);
      };

      const renderFieldChange = item => {
        const oldValue = displayDiffValue(item.old);
        const newValue = displayDiffValue(item.new);
        const body = `
          <div class="grid md:grid-cols-[1fr_auto_1fr] gap-2 items-stretch mt-2">
            <pre class="whitespace-pre-wrap break-words rounded-lg bg-slate-50 border border-slate-100 p-3 text-xs text-slate-600">${escapeHtml(oldValue)}</pre>
            <div class="self-center text-slate-400 text-center">→</div>
            <pre class="whitespace-pre-wrap break-words rounded-lg bg-indigo-50 border border-indigo-100 p-3 text-xs text-indigo-800">${escapeHtml(newValue)}</pre>
          </div>`;
        if (item.field === 'instructions') {
          return `<details class="rounded-xl border border-slate-100 p-3"><summary class="cursor-pointer text-xs font-semibold text-slate-700">${escapeHtml(item.label)}</summary>${body}</details>`;
        }
        return `<div class="rounded-xl border border-slate-100 p-3"><div class="text-xs font-semibold text-slate-700">${escapeHtml(item.label)}</div>${body}</div>`;
      };

      const renderBindingChanges = (label, values) => {
        const added = values?.added || [];
        const removed = values?.removed || [];
        if (!added.length && !removed.length) return '';
        return `
          <div class="rounded-xl bg-slate-50 border border-slate-100 p-3 text-xs">
            <div class="font-semibold text-slate-700">${escapeHtml(label)}</div>
            ${added.length ? `<div class="mt-1 text-emerald-700">+ ${added.map(item => escapeHtml(item.name)).join('、')}</div>` : ''}
            ${removed.length ? `<div class="mt-1 text-red-700">− ${removed.map(item => escapeHtml(item.name)).join('、')}</div>` : ''}
          </div>`;
      };

      const renderAgentChange = agent => `
        <div class="bg-white rounded-2xl border border-slate-200 p-4">
          <div class="flex items-center justify-between gap-3">
            <div>
              <div class="font-semibold text-slate-900">${escapeHtml(agent.name || agent.agent_id)}</div>
              <div class="text-[11px] font-mono text-slate-400 mt-0.5">${escapeHtml(agent.agent_id || '')}</div>
            </div>
            <span class="px-2 py-1 rounded-full border text-xs ${changeStyles[agent.change_type] || changeStyles.modified}">${changeLabels[agent.change_type] || agent.change_type}</span>
          </div>
          ${(agent.fields || []).length ? `<div class="space-y-2 mt-3">${agent.fields.map(renderFieldChange).join('')}</div>` : ''}
          <div class="grid md:grid-cols-3 gap-2 mt-3">
            ${renderBindingChanges('Skill', agent.capabilities?.skills)}
            ${renderBindingChanges('RAG 文档', agent.capabilities?.knowledge)}
            ${renderBindingChanges('MCP Server', agent.capabilities?.mcp_servers)}
          </div>
        </div>`;

      const renderEntityChanges = (title, items) => {
        if (!items?.length) return '';
        return `
          <section>
            <h4 class="text-sm font-semibold text-slate-800 mb-2">${escapeHtml(title)}</h4>
            <div class="space-y-2">
              ${items.map(item => `
                <div class="bg-white rounded-xl border border-slate-200 p-3">
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-sm font-medium text-slate-800">${escapeHtml(item.name || item.id)}</span>
                    <span class="text-xs px-2 py-1 rounded-full border ${changeStyles[item.change_type] || changeStyles.modified}">${changeLabels[item.change_type] || item.change_type}</span>
                  </div>
                  ${(item.fields || []).length ? `<div class="space-y-2 mt-2">${item.fields.map(renderFieldChange).join('')}</div>` : ''}
                </div>`).join('')}
            </div>
          </section>`;
      };

      const renderDiff = diff => {
        const summary = diff?.summary || {};
        const hasChanges = !!diff?.has_changes;
        return `
          <div class="space-y-4">
            <div class="grid grid-cols-2 md:grid-cols-5 gap-2">
              ${[
                ['新增', summary.added || 0, 'text-emerald-700'],
                ['修改', summary.modified || 0, 'text-indigo-700'],
                ['停用', summary.disabled || 0, 'text-amber-700'],
                ['删除', summary.deleted || 0, 'text-red-700'],
                ['受影响 Agent', summary.affected_agents || 0, 'text-slate-800']
              ].map(([label, value, style]) => `<div class="rounded-xl bg-slate-50 border border-slate-100 p-3 text-center"><div class="text-xl font-semibold ${style}">${value}</div><div class="text-[11px] text-slate-500 mt-1">${label}</div></div>`).join('')}
            </div>
            ${!hasChanges ? '<div class="rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-800">当前没有待发布变更。</div>' : ''}
            ${(diff?.agents || []).length ? `<section><h4 class="text-sm font-semibold text-slate-800 mb-2">Agent 参数与挂载能力</h4><div class="space-y-3">${diff.agents.map(renderAgentChange).join('')}</div></section>` : ''}
            ${renderEntityChanges('Skill 变化', diff?.skills)}
            ${renderEntityChanges('RAG 文档变化', diff?.knowledge)}
            ${renderEntityChanges('MCP Server 变化', diff?.mcp_servers)}
            ${renderEntityChanges('MCP Tool 与读写策略', diff?.mcp_tools)}
            ${(diff?.policies || []).length ? `
              <section>
                <h4 class="text-sm font-semibold text-slate-800 mb-2">模型、检索与预算策略</h4>
                <div class="space-y-2">${diff.policies.map(item => renderFieldChange({ ...item, label: `${item.label} · ${item.field}` })).join('')}</div>
              </section>` : ''}
          </div>`;
      };

      const releaseVersionFromId = releaseId => {
        const match = String(releaseId || '').match(/^rr_(\d+)_/);
        return match ? String(Number(match[1])) : '';
      };

      const historicalDiffSide = (item, side, changeType) => {
        const value = item?.[side];
        if ((value === null || value === undefined) && side === 'old' && changeType === 'added') {
          return { text: '不存在', placeholder: true };
        }
        if ((value === null || value === undefined) && side === 'new' && changeType === 'deleted') {
          return { text: '已删除', placeholder: true };
        }
        return { text: displayDiffValue(value), placeholder: false };
      };

      const renderHistoricalValue = (item, side, changeType) => {
        const label = side === 'old' ? '修改前' : '修改后';
        const value = historicalDiffSide(item, side, changeType);
        const tone = side === 'old'
          ? 'bg-slate-50 border-slate-200 text-slate-700'
          : 'bg-indigo-50/70 border-indigo-100 text-indigo-900';
        const placeholderTone = value.placeholder ? 'italic text-slate-400' : '';
        if (item.field === 'instructions' && !value.placeholder) {
          const preview = value.text.split(/\r?\n/).slice(0, 3).join('\n').slice(0, 240);
          return `
            <div class="min-w-0">
              <div class="md:hidden text-[11px] font-semibold text-slate-500 mb-1">${label}</div>
              <details class="group rounded-xl border ${tone}">
                <summary class="cursor-pointer list-none p-3">
                  <pre class="whitespace-pre-wrap break-words text-xs font-sans">${escapeHtml(preview || '（空）')}${value.text.length > preview.length ? '…' : ''}</pre>
                  <span class="inline-flex mt-2 text-[11px] font-medium text-indigo-600 group-open:hidden">展开完整 Prompt</span>
                  <span class="hidden mt-2 text-[11px] font-medium text-indigo-600 group-open:inline-flex">收起完整 Prompt</span>
                </summary>
                <pre class="mx-3 mb-3 max-h-80 overflow-auto whitespace-pre-wrap break-words rounded-lg bg-white/70 border border-slate-200 p-3 text-xs text-slate-700">${escapeHtml(value.text || '（空）')}</pre>
              </details>
            </div>`;
        }
        return `
          <div class="min-w-0">
            <div class="md:hidden text-[11px] font-semibold text-slate-500 mb-1">${label}</div>
            <pre class="h-full whitespace-pre-wrap break-words rounded-xl border p-3 text-xs font-sans ${tone} ${placeholderTone}">${escapeHtml(value.text)}</pre>
          </div>`;
      };

      const renderHistoricalFieldTable = (fields, changeType) => {
        if (!fields?.length) {
          return '<div class="rounded-xl border border-dashed border-slate-200 p-3 text-xs text-slate-500">没有字段级参数变化。</div>';
        }
        return `
          <div class="overflow-hidden rounded-xl border border-slate-200">
            <div class="hidden md:grid md:grid-cols-[160px_minmax(0,1fr)_minmax(0,1fr)] gap-3 bg-slate-100 px-4 py-2 text-xs font-semibold text-slate-600">
              <div>变更项</div>
              <div>修改前</div>
              <div>修改后</div>
            </div>
            <div class="divide-y divide-slate-100">
              ${fields.map(item => `
                <div class="grid md:grid-cols-[160px_minmax(0,1fr)_minmax(0,1fr)] gap-3 p-3 md:p-4 bg-white">
                  <div class="text-sm font-semibold text-slate-800">${escapeHtml(item.label || item.field || '参数')}</div>
                  ${renderHistoricalValue(item, 'old', changeType)}
                  ${renderHistoricalValue(item, 'new', changeType)}
                </div>`).join('')}
            </div>
          </div>`;
      };

      const collectHistoricalCapabilities = agent => {
        const types = [
          ['Skill', agent.capabilities?.skills],
          ['RAG 文档', agent.capabilities?.knowledge],
          ['MCP', agent.capabilities?.mcp_servers]
        ];
        const result = { added: [], removed: [] };
        types.forEach(([type, values]) => {
          (values?.added || []).forEach(item => result.added.push({ type, name: item.name || item.id || '-' }));
          (values?.removed || []).forEach(item => result.removed.push({ type, name: item.name || item.id || '-' }));
        });
        return result;
      };

      const renderCapabilityChangeZone = (title, items, added) => `
        <div class="rounded-xl border ${added ? 'border-emerald-200 bg-emerald-50/60' : 'border-red-200 bg-red-50/60'} p-3">
          <div class="text-xs font-semibold ${added ? 'text-emerald-800' : 'text-red-800'}">${title}</div>
          <div class="mt-2 space-y-1.5">
            ${items.length ? items.map(item => `
              <div class="flex items-start gap-2 text-sm ${added ? 'text-emerald-800' : 'text-red-800'}">
                <span class="font-bold">${added ? '+' : '−'}</span>
                <span><span class="text-[11px] font-semibold opacity-70">${escapeHtml(item.type)}</span> ${escapeHtml(item.name)}</span>
              </div>`).join('') : `<div class="text-xs ${added ? 'text-emerald-700' : 'text-red-700'} opacity-70">无</div>`}
          </div>
        </div>`;

      const renderHistoricalAgentChange = agent => {
        const capabilities = collectHistoricalCapabilities(agent);
        return `
          <article class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="flex flex-wrap items-center justify-between gap-3 px-4 md:px-5 py-4 border-b border-slate-100">
              <div>
                <div class="flex items-center gap-2">
                  <h4 class="font-semibold text-slate-900">${escapeHtml(agent.name || agent.agent_id)}</h4>
                  <span class="px-2 py-1 rounded-full border text-xs ${changeStyles[agent.change_type] || changeStyles.modified}">${changeLabels[agent.change_type] || agent.change_type}</span>
                </div>
                <div class="text-[11px] font-mono text-slate-400 mt-1">${escapeHtml(agent.agent_id || '')}</div>
              </div>
              <div class="text-xs text-slate-500">${(agent.fields || []).length} 项参数变化 · ${capabilities.added.length + capabilities.removed.length} 项挂载变化</div>
            </div>
            <div class="p-4 md:p-5 space-y-5">
              <section>
                <h5 class="text-sm font-semibold text-slate-800 mb-2">A. Agent 参数变化</h5>
                ${renderHistoricalFieldTable(agent.fields || [], agent.change_type)}
              </section>
              <section>
                <h5 class="text-sm font-semibold text-slate-800 mb-2">B. 挂载能力变化</h5>
                <div class="grid md:grid-cols-2 gap-3">
                  ${renderCapabilityChangeZone('新增能力', capabilities.added, true)}
                  ${renderCapabilityChangeZone('移除能力', capabilities.removed, false)}
                </div>
              </section>
            </div>
          </article>`;
      };

      const historicalOtherGroups = diff => [
        ['Skill', diff?.skills || []],
        ['RAG 文档', diff?.knowledge || []],
        ['MCP Server', diff?.mcp_servers || []],
        ['MCP Tool 与读写策略', diff?.mcp_tools || []]
      ];

      const historicalOtherCount = diff => (
        historicalOtherGroups(diff).reduce((total, [, items]) => total + items.length, 0)
        + (diff?.policies || []).length
      );

      const renderHistoricalOtherChanges = diff => {
        const count = historicalOtherCount(diff);
        if (!count) return '';
        const entityHtml = historicalOtherGroups(diff).map(([title, items]) => {
          if (!items.length) return '';
          return `
            <section>
              <h5 class="text-sm font-semibold text-slate-800 mb-2">${escapeHtml(title)}</h5>
              <div class="space-y-3">
                ${items.map(item => `
                  <div class="rounded-xl border border-slate-200 bg-white overflow-hidden">
                    <div class="flex items-center justify-between gap-2 px-4 py-3 bg-slate-50">
                      <span class="text-sm font-medium text-slate-800">${escapeHtml(item.name || item.id)}</span>
                      <span class="text-xs px-2 py-1 rounded-full border ${changeStyles[item.change_type] || changeStyles.modified}">${changeLabels[item.change_type] || item.change_type}</span>
                    </div>
                    <div class="p-3">${renderHistoricalFieldTable(item.fields || [], item.change_type)}</div>
                  </div>`).join('')}
              </div>
            </section>`;
        }).join('');
        const policies = (diff?.policies || []).length ? `
          <section>
            <h5 class="text-sm font-semibold text-slate-800 mb-2">模型、检索与预算策略</h5>
            ${renderHistoricalFieldTable(
              diff.policies.map(item => ({ ...item, label: `${item.label} · ${item.field}` })),
              'modified'
            )}
          </section>` : '';
        return `
          <details class="rounded-2xl border border-slate-200 bg-slate-50/70">
            <summary class="cursor-pointer px-4 md:px-5 py-4 font-semibold text-sm text-slate-800">其他配置变化（${count}项）</summary>
            <div class="px-4 md:px-5 pb-5 space-y-5">${entityHtml}${policies}</div>
          </details>`;
      };

      const buildHistoricalDiffNarrative = diff => {
        if (!diff?.has_changes) return '该版本配置与上一版本相同，属于历史重复快照。';
        const agentPhrases = (diff.agents || []).map(agent => {
          const name = agent.name || agent.agent_id || '未命名 Agent';
          if (agent.change_type === 'added') return `新增了 ${name}`;
          if (agent.change_type === 'deleted') return `删除了 ${name}`;
          const fieldLabels = (agent.fields || []).map(item => item.label || item.field).filter(Boolean);
          const capabilities = collectHistoricalCapabilities(agent);
          const parts = [];
          if (fieldLabels.length) parts.push(`修改了 ${name} 的${fieldLabels.join('、')}`);
          if (capabilities.added.length) parts.push(`为 ${name} 新增 ${capabilities.added.length} 项挂载能力`);
          if (capabilities.removed.length) parts.push(`从 ${name} 移除 ${capabilities.removed.length} 项挂载能力`);
          return parts.join('，') || `${changeLabels[agent.change_type] || '调整'}了 ${name}`;
        });
        const otherCount = historicalOtherCount(diff);
        const phrases = [...agentPhrases];
        if (otherCount) phrases.push(`另有 ${otherCount} 项其他配置变化`);
        return `本次${phrases.length ? phrases.join('；') : '存在配置变化'}。`;
      };

      const renderHistoricalReleaseMeta = (release, label, currentId) => `
        <div class="rounded-xl border ${release?.release_id === currentId ? 'border-emerald-200 bg-emerald-50/60' : 'border-slate-200 bg-white'} p-3 min-w-0">
          <div class="flex flex-wrap items-center gap-2">
            <span class="text-xs font-semibold text-slate-500">${label}</span>
            <span class="text-base font-semibold text-slate-900">Release #${escapeHtml(String(release?.version || '-'))}</span>
            ${release?.release_id === currentId ? '<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-[11px]">当前运行</span>' : ''}
          </div>
          <div class="mt-1 text-[11px] font-mono text-slate-500 break-all">${escapeHtml(release?.release_id || '-')}</div>
          <div class="mt-1 text-xs text-slate-500">发布时间：${escapeHtml(release?.published_at || release?.created_at || '未发布')}</div>
        </div>`;

      const renderHistoricalDiffComparison = (data, currentId) => {
        const release = data?.release || {};
        const parent = data?.parent_release || null;
        const diff = data?.diff || {};
        const summary = diff.summary || {};
        if (!parent) {
          return `
            <div class="space-y-4">
              ${renderHistoricalReleaseMeta(release, '当前版本', currentId)}
              <div class="rounded-2xl border border-indigo-200 bg-indigo-50 p-5 text-sm text-indigo-900">
                <div class="font-semibold">这是初始版本，没有上一个版本可供比较。</div>
                <div class="text-xs text-indigo-700 mt-1">完整原始快照仍可从历史列表按需查看。</div>
              </div>
            </div>`;
        }
        return `
          <div class="space-y-5">
            <section>
              <div class="grid md:grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] gap-3 items-center">
                ${renderHistoricalReleaseMeta(parent, '父版本', currentId)}
                <div class="text-center text-xl text-slate-400">→</div>
                ${renderHistoricalReleaseMeta(release, '当前版本', currentId)}
              </div>
            </section>
            <section class="rounded-2xl border ${diff.has_changes ? 'border-indigo-200 bg-indigo-50/70' : 'border-amber-200 bg-amber-50'} p-4 md:p-5">
              <div class="text-xs font-semibold ${diff.has_changes ? 'text-indigo-600' : 'text-amber-700'}">变更结论</div>
              <div class="mt-1 text-base font-semibold ${diff.has_changes ? 'text-indigo-950' : 'text-amber-900'}">${escapeHtml(buildHistoricalDiffNarrative(diff))}</div>
              <div class="mt-3 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500">
                <span>新增 ${summary.added || 0}</span>
                <span>修改 ${summary.modified || 0}</span>
                <span>停用 ${summary.disabled || 0}</span>
                <span>删除 ${summary.deleted || 0}</span>
                <span>受影响 Agent ${summary.affected_agents || 0}</span>
              </div>
            </section>
            ${!diff.has_changes ? '' : `
              ${(diff.agents || []).length ? `
                <section>
                  <div class="mb-3">
                    <h3 class="text-base font-semibold text-slate-900">Agent 变化</h3>
                    <p class="text-xs text-slate-500 mt-1">先看用户可感知的 Agent 参数和挂载能力，再查看其他工程配置。</p>
                  </div>
                  <div class="space-y-4">${diff.agents.map(renderHistoricalAgentChange).join('')}</div>
                </section>` : '<div class="rounded-xl border border-dashed border-slate-200 p-4 text-sm text-slate-500">本次没有 Agent 参数或挂载能力变化。</div>'}
              ${renderHistoricalOtherChanges(diff)}
            `}
          </div>`;
      };

      const openReleaseDiffModal = (data, currentRelease) => {
        const release = data?.release || {};
        const parent = data?.parent_release || null;
        const currentId = currentRelease?.release_id || '';
        const comparisonTitle = parent
          ? `Release #${parent.version || '-'} → Release #${release.version || '-'}`
          : `Release #${release.version || '-'}（初始版本）`;
        const modal = document.createElement('div');
        modal.id = 'runtime-history-diff-modal';
        modal.className = 'fixed inset-0 z-[60] flex items-center justify-center bg-slate-950/55 p-3 md:p-6';
        modal.innerHTML = `
          <div class="bg-slate-50 rounded-2xl shadow-2xl w-full max-w-6xl max-h-[94vh] flex flex-col overflow-hidden">
            <div class="flex items-start justify-between gap-4 px-4 md:px-6 py-4 border-b border-slate-200 bg-white">
              <div>
                <div class="text-xs font-semibold text-indigo-600">历史 RuntimeRelease 差异</div>
                <h2 class="text-lg md:text-xl font-semibold text-slate-900 mt-1">${escapeHtml(comparisonTitle)}</h2>
                <div class="text-xs text-slate-500 mt-1">当前运行版本：Release #${escapeHtml(String(currentRelease?.version || '-'))} · ${escapeHtml(currentId || '-')}</div>
              </div>
              <button class="runtime-history-diff-close shrink-0 p-2 hover:bg-slate-100 rounded-lg text-slate-500" aria-label="关闭历史版本差异">&times;</button>
            </div>
            <div class="p-4 md:p-6 overflow-y-auto flex-1 min-h-0">${renderHistoricalDiffComparison(data, currentId)}</div>
            <div class="px-4 md:px-6 py-3 border-t border-slate-200 bg-white flex justify-end">
              <button class="runtime-history-diff-close px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-sm text-slate-700">关闭</button>
            </div>
          </div>`;
        const previousOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        document.body.appendChild(modal);
        const close = () => {
          document.body.style.overflow = previousOverflow;
          modal.remove();
        };
        modal.querySelectorAll('.runtime-history-diff-close').forEach(button => button.addEventListener('click', close));
        modal.addEventListener('click', event => { if (event.target === modal) close(); });
      };

      const renderReleaseSummary = (release, current = false) => {
        if (!release) return '<div class="rounded-2xl border border-red-100 bg-red-50 p-4 text-sm text-red-700">当前没有 Published RuntimeRelease。</div>';
        const validation = release.validation || {};
        const counts = validation.counts || {};
        return `

      async function openAdvancedAcceptance() {

          const publishButton = requireElement('#runtime-publish-btn', 'RuntimeRelease 发布中心');

          bindHistoryActions(requireElement('#runtime-history-list', 'RuntimeRelease 历史版本'), current);

        } catch (err) {
          showToast('发布失败：' + (err.message || err), 'error');
        }
      });

      await loadOverview();

          $('#agents-content').innerHTML = emptyState('加载失败，请刷新重试');
        }
      }

      function bindAgentActions() {
        $$('.agent-edit-btn').forEach(btn => {
          btn.addEventListener('click', () => editAgent(Number(btn.dataset.id)));
        });
        $$('.agent-delete-btn').forEach(btn => {
          btn.addEventListener('click', () => deleteAgent(Number(btn.dataset.id)));
        });
        $$('.agent-toggle').forEach(toggle => {
          toggle.addEventListener('change', async () => {
            const agentId = Number(toggle.dataset.id);
            const enabled = toggle.checked;
            try {
              await apiPatch(`/api/agents/${agentId}`, { enabled });
              showToast(`Agent Draft 已${enabled ? '启用' : '禁用'}；发布 RuntimeRelease 后进入下一新会话`);
              await loadAgents();
            } catch (err) {
              showToast('状态更新失败', 'error');
              toggle.checked = !enabled;
            }
          });
        });
      }

      async function openAgentModal(agent = null) {
        const isEdit = !!agent;
        const isSeededRouter = isEdit && agent.agent_id === 'router' && agent.is_router;
        const title = isEdit ? (isSeededRouter ? '编辑路由策略' : '编辑 Agent') : '新增 Agent';
        const selectedSkillNames = (agent && agent.available_skills || []).map(s => (typeof s === 'object' && s !== null ? (s.name || '') : String(s))).filter(Boolean);
        let skills = [];
        let mcpTools = [];
        let knowledgeDocs = [];
        try {
          const [skillsData, mcpData, knowledgeData] = await Promise.all([
            apiGet('/api/skills'),
            apiGet('/api/mcp-servers'),
            apiGet('/api/knowledge/docs')
          ]);
          skills = (skillsData.skills || []).map(s => ({ value: s.name, label: `${s.name} (${s.category || '未分类'})` }));
          knowledgeDocs = (knowledgeData.knowledge_docs || [])
            .filter(doc => doc.source_type !== 'demo_test' && doc.is_indexed)
            .map(doc => ({ value: String(doc.id), label: `${doc.title}（${doc.chunk_count || 0} 分片）` }));
          // Bindings are stored at MCP Server level (tool_name = server name).  Only
          // enabled servers with at least one successfully discovered tool are shown
          // as bindable; disabled / test / tool-less servers are hidden by default.
          const toolPromises = (mcpData.mcp_servers || [])
            .filter(serv => serv.enabled)
            .map(async serv => {
              const tools = serv.tools || (await apiGet(`/api/mcp-servers/${serv.id}/tools`)).tools || [];
              if (!tools.length) return null;
              const toolDescs = tools.map(t => `${t.name}${t.description ? '：' + t.description : ''}`).join('；');
              return { value: serv.name, label: `${serv.name}（${toolDescs}）` };
            });
          mcpTools = (await Promise.all(toolPromises)).filter(Boolean);
        } catch (err) {
          console.error('加载 Agent 选项失败', err);
        }

        // Build router members section when viewing the seeded router.
        let routerMembersHtml = '';
        if (isSeededRouter) {
          const members = cachedAgents.filter(a => !a.is_router && a.enabled);
          routerMembersHtml = `
            <div class="mt-5">
              <h4 class="text-sm font-semibold text-slate-900 mb-2">当前路由成员</h4>
              ${members.length === 0 ? '<p class="text-xs text-slate-400">暂无启用的垂直 Agent</p>' : `
              <div class="space-y-2 max-h-64 overflow-y-auto pr-1">
                ${members.map(m => `
                  <div class="bg-slate-50 rounded-xl p-3 border border-slate-200">
                    <div class="flex items-center justify-between mb-1">
                      <span class="text-sm font-medium text-slate-900">${escapeHtml(m.name)}</span>
                      <span class="text-xs px-2 py-0.5 rounded-full ${m.enabled ? 'bg-brand-50 text-brand-600' : 'bg-slate-100 text-slate-400'}">${m.enabled ? '启用' : '禁用'}</span>
                    </div>
                    <p class="text-xs text-slate-500 mb-1.5">${escapeHtml(m.description || '-')}</p>
                    <div class="text-xs text-slate-600 space-y-0.5">
                      <div><span class="text-slate-400">绑定 Skill：</span>${(m.available_skills || []).length ? escapeHtml((m.available_skills || []).map(s => (typeof s === 'object' && s !== null ? (s.name || '') : String(s))).filter(Boolean).join('、')) : '无'}</div>
                      <div><span class="text-slate-400">绑定 MCP：</span>${(m.available_mcp_tools || []).length ? escapeHtml((m.available_mcp_tools || []).join('、')) : '无'}</div>
                    </div>
                  </div>
                `).join('')}
              </div>`}
            </div>
          `;
        }

        let body;
        if (isSeededRouter) {
          body = `
            <div class="space-y-4 text-sm">
              <div class="bg-slate-50 rounded-xl p-3 border border-slate-200">
                <div class="flex justify-between mb-1"><span class="text-slate-500">名称</span><span class="font-medium text-slate-900">${escapeHtml(agent.name)}</span></div>
                <div class="flex justify-between mb-1"><span class="text-slate-500">agent_id</span><span class="font-mono text-slate-700">${escapeHtml(agent.agent_id)}</span></div>
                <div class="flex justify-between mb-1"><span class="text-slate-500">类型</span><span class="text-xs px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600">路由</span></div>
                <div class="flex justify-between mb-1"><span class="text-slate-500">状态</span><span>${agent.enabled ? '启用' : '禁用'}</span></div>
              </div>
              ${formInput('名称', 'agent-name', agent ? agent.name : '', '路由 Agent 名称')}
              ${formInput('描述', 'agent-description', agent ? agent.description : '', '简短描述路由 Agent 职责')}
              ${formTextarea('System Prompt', 'agent-system-prompt', agent ? agent.system_prompt : '', '定义路由 Agent 的系统提示词；运行时会自动附加当前启用垂直 Agent 清单与 JSON 输出契约', 5)}
              ${routerMembersHtml}
            </div>
          `;
          openModal(title, body, async () => {
            const payload = {
              name: $('#agent-name').value.trim(),
              description: $('#agent-description').value.trim(),
              system_prompt: $('#agent-system-prompt').value.trim(),
            };
            if (!payload.name || !payload.system_prompt) {
              showToast('名称和 System Prompt 不能为空', 'error');
              return;
            }
            try {
              await apiPut(`/api/agents/${agent.id}`, payload);
              showToast('路由策略已更新');
              closeModal();
              await loadAgents();
            } catch (err) {
              showToast('保存失败，请重试', 'error');

          });
          return;
        }

        const runtimeNote = `
          <div class="mb-4 rounded-xl border border-brand-100 bg-brand-50 p-3 text-xs text-brand-800">
            <div class="font-semibold mb-1">运行时动态注入</div>

          </div>`;
        const selectedKnowledgeIds = agent
          ? (agent.knowledge_doc_ids === null
            ? knowledgeDocs.map(item => item.value)
            : (agent.knowledge_doc_ids || []).map(String))
          : [];
        body = `
          ${runtimeNote}
          ${formInput('名称', 'agent-name', agent ? agent.name : '', '如：维修报修 Agent')}
          ${formInput('描述', 'agent-description', agent ? agent.description : '', '简短描述 Agent 职责')}
          ${formSelect('业务域', 'agent-domain-scope', [
            { value: 'property', label: 'property｜物业业务（默认强治理）' },
            { value: 'isolated_general', label: 'isolated_general｜非物业隔离回答' }
          ], agent ? (agent.domain_scope || 'property') : 'property')}
          <p class="-mt-2 mb-3 text-xs text-slate-500">修改会进入Agent Draft，不调用模型、不自动发布；发布RuntimeRelease后仅新会话生效，旧会话保持原Snapshot。</p>
          ${formTextarea('System Prompt', 'agent-system-prompt', agent ? agent.system_prompt : '', '定义该 Agent 的系统提示词', 5)}
          ${formCheckboxGroup('可用 Skill', 'agent-skills', skills, agent ? selectedSkillNames : [])}
          ${formCheckboxGroup('可用 MCP Server（展开查看可调用工具）', 'agent-mcp-tools', mcpTools, agent ? agent.available_mcp_tools : [])}
          ${formCheckboxGroup('可用 RAG 文档（发布快照固定）', 'agent-knowledge-docs', knowledgeDocs, selectedKnowledgeIds)}
        `;
        openModal(title, body, async () => {
          const payload = {
            name: $('#agent-name').value.trim(),
            description: $('#agent-description').value.trim(),
            domain_scope: $('#agent-domain-scope').value,
            system_prompt: $('#agent-system-prompt').value.trim(),
            available_skills: Array.from(document.querySelectorAll('input[name="agent-skills"]:checked')).map(cb => cb.value),
            available_mcp_tools: Array.from(document.querySelectorAll('input[name="agent-mcp-tools"]:checked')).map(cb => cb.value),
            knowledge_doc_ids: Array.from(document.querySelectorAll('input[name="agent-knowledge-docs"]:checked')).map(cb => Number(cb.value)),
            enabled: true
          };
          if (!payload.name || !payload.system_prompt) {
            showToast('名称和 System Prompt 不能为空', 'error');
            return;
          }
          try {
            if (isEdit) {
              await apiPut(`/api/agents/${agent.id}`, payload);
              showToast('Agent Draft 已更新；请发布 RuntimeRelease');
            } else {
              await apiPost('/api/agents', payload);
              showToast('Agent Draft 已创建；请绑定能力并发布 RuntimeRelease');
            }
            closeModal();
            await loadAgents();
          } catch (err) {
            showToast('保存失败，请重试', 'error');
          }
        });
      }

      async function editAgent(agentId) {
        try {
          const data = await apiGet(`/api/agents/${agentId}`);
          openAgentModal(data.agent);
        } catch (err) {
          showToast('加载 Agent 失败', 'error');

      async function deleteAgent(agentId) {
        if (!confirm('确定要删除这个 Agent 吗？')) return;
        try {
          await apiDelete(`/api/agents/${agentId}`);
          showToast('Agent 已从 Draft 删除；已发布会话快照不受影响');
          await loadAgents();
        } catch (err) {
          showToast('删除失败，请重试', 'error');
        }
      }

      $('#agent-add-btn').addEventListener('click', () => openAgentModal());
      await loadAgents();
    }

                  <div class="text-xs text-slate-500 mb-3 space-y-1">

                    <p>优先级 ${(skill.runtime_contract || {}).priority ?? 50} · ${((skill.runtime_contract || {}).legacy_mode) ? '旧版 Prompt 模式，建议补齐治理字段' : '治理契约已配置'}</p>

                  <details class="text-xs text-slate-500 bg-slate-50 rounded-lg p-2"><summary class="cursor-pointer font-medium text-slate-700">查看Skill指令原文</summary><div class="mt-2 whitespace-pre-line">${escapeHtml(skill.instructions)}</div></details>
                  <details class="mt-4 pt-4 border-t border-slate-100">
                    <summary class="cursor-pointer text-xs font-medium text-slate-600">高级管理：修改、预览或删除</summary>
                    <p class="mt-2 text-[11px] text-slate-500">启停、编辑、回滚和删除会修改Skill Draft；不调用模型、不自动发布RuntimeRelease。发布后仅新会话生效，旧会话保持原Snapshot；“预览触发结果”也不代表已在Published会话中生效。</p>
                    <div class="mt-3 flex items-center justify-between rounded-lg border border-slate-200 bg-white px-3 py-2">

                        <input type="checkbox" class="skill-toggle sr-only peer" data-id="${skill.id}" ${skill.enabled ? 'checked' : ''}>

                      <button data-id="${skill.id}" class="skill-versions-btn text-xs px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors">查看Skill版本</button>
                      <button data-id="${skill.id}" class="skill-files-btn text-xs px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors">管理Skill文件</button>
                      <button data-id="${skill.id}" class="skill-test-btn text-xs px-3 py-1.5 bg-brand-50 hover:bg-brand-100 text-brand-700 rounded-lg transition-colors">预览触发结果</button>
                      <button data-id="${skill.id}" class="skill-export-btn text-xs px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors">导出Skill</button>
                      <button data-id="${skill.id}" class="skill-delete-btn text-xs px-3 py-1.5 border border-red-200 hover:bg-red-50 text-red-600 rounded-lg transition-colors">从Draft删除Skill</button>

          $('#skills-content').innerHTML = emptyState('加载失败，请刷新重试');

      function bindSkillActions() {
        $$('.skill-edit-btn').forEach(btn => {
          btn.addEventListener('click', () => editSkill(Number(btn.dataset.id)));
        });
        $$('.skill-versions-btn').forEach(btn => {
          btn.addEventListener('click', () => showSkillVersions(Number(btn.dataset.id)));
        });
        $$('.skill-delete-btn').forEach(btn => {
          btn.addEventListener('click', () => deleteSkill(Number(btn.dataset.id)));
        });
        $$('.skill-test-btn').forEach(btn => {
          btn.addEventListener('click', () => testSkill(Number(btn.dataset.id)));
        });
        $$('.skill-export-btn').forEach(btn => {
          btn.addEventListener('click', () => exportSkill(Number(btn.dataset.id)));
        });
        $$('.skill-files-btn').forEach(btn => {
          btn.addEventListener('click', () => manageSkillFiles(Number(btn.dataset.id)));
        });
        $$('.skill-toggle').forEach(toggle => {
          toggle.addEventListener('change', async () => {
            const skillId = Number(toggle.dataset.id);
            const enabled = toggle.checked;
            try {
              const data = await apiGet(`/api/skills/${skillId}`);
              const skill = data.skill;
              await apiPut(`/api/skills/${skillId}`, {
                name: skill.name,
                description: skill.description,
                instructions: skill.instructions,
                category: skill.category,
                enabled: enabled,
                trigger_condition: skill.trigger_condition || '',
                skill_metadata: skill.skill_metadata || {},
                model_id: skill.model_id || null
              });
              showToast(`Skill Draft 已${enabled ? '启用' : '禁用'}；请发布 RuntimeRelease`);
              await loadSkills();
            } catch (err) {
              showToast('状态更新失败', 'error');
              toggle.checked = !enabled;
            }
          });
        });
      }

      function openSkillModal(skill = null) {
        const isEdit = !!skill;
        const title = isEdit ? '编辑 Skill' : '新增 Skill';
        const meta = (skill && skill.skill_metadata) || {};
        const asTerms = value => Array.isArray(value) ? value.join('、') : (value || '');
        const body = `
          ${formInput('名称', 'skill-name', skill ? skill.name : '', '如：维修工单处理')}
          ${formInput('分类', 'skill-category', skill ? skill.category : '', '如：业务技能、系统技能')}
          ${formInput('描述', 'skill-description', skill ? skill.description : '', '简短描述 Skill 用途')}
          ${formSwitch('启用', 'skill-enabled', skill ? skill.enabled : true)}
          <div class="rounded-xl border border-brand-100 bg-brand-50/50 p-3 text-xs text-slate-600">Skill 是“可重复、可验收的业务方法”，不是默认塞入的一段 Prompt。只有同时满足 <b>Agent 已绑定 + 正向触发命中 + 未命中负向条件 + 未被高优先级冲突项排除</b> 时，才会注入本轮对话。</div>
          ${formInput('正向触发', 'skill-trigger', skill ? (skill.trigger_condition || asTerms(meta.positive_triggers)) : '', '逗号分隔，如：报修、漏水、查询工单')}
          ${formInput('负向触发', 'skill-negative-trigger', asTerms(meta.negative_triggers), '命中后禁止注入，如：仅咨询价格、不需报修')}
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${formInput('优先级（0-100）', 'skill-priority', String(meta.priority ?? 50), '数字越大越优先')}
            ${formInput('冲突组（可选）', 'skill-conflict-group', meta.conflict_group || '', '同组只保留最高优先级 Skill')}
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${formSwitch('允许同冲突组叠加', 'skill-composable', !!meta.composable)}
            ${formSwitch('默认注入（谨慎）', 'skill-always-on', !!meta.always_on)}
          </div>
          ${formInput('工具提示（可选）', 'skill-tool-hints', asTerms(meta.tool_hints), '仅提示 SOP；真实工具权限仍由 Agent MCP 绑定决定')}
          ${formTextarea('输入契约（可选）', 'skill-input-contract', meta.input_contract || '', '此 Skill 需要哪些信息；信息缺失时如何追问', 3)}
          ${formTextarea('输出契约（可选）', 'skill-output-contract', meta.output_contract || '', '输出必须包含什么；哪些动作必须等待用户确认', 3)}
          ${formTextarea('指令 (Instructions)', 'skill-instructions', skill ? skill.instructions : '', '定义 Skill 的系统提示词与行为约束', 6)}
        `;
        openModal(title, body, async () => {
          const splitTerms = value => value.split(/[，、,;；|]+/).map(item => item.trim()).filter(Boolean);
          const existingMetadata = meta || {};
          const payload = {
            name: $('#skill-name').value.trim(),
            category: $('#skill-category').value.trim() || '未分类',
            description: $('#skill-description').value.trim(),
            instructions: $('#skill-instructions').value.trim(),
            trigger_condition: $('#skill-trigger').value.trim(),
            enabled: $('#skill-enabled').checked,
            skill_metadata: {
              ...existingMetadata,
              positive_triggers: splitTerms($('#skill-trigger').value),
              negative_triggers: splitTerms($('#skill-negative-trigger').value),
              priority: Number($('#skill-priority').value || 50),
              conflict_group: $('#skill-conflict-group').value.trim(),
              composable: $('#skill-composable').checked,
              always_on: $('#skill-always-on').checked,
              tool_hints: splitTerms($('#skill-tool-hints').value),
              input_contract: $('#skill-input-contract').value.trim(),
              output_contract: $('#skill-output-contract').value.trim()
            }
          };
          if (!payload.name) {
            showToast('Skill 名称不能为空', 'error');
            return;
          }
          try {
            if (isEdit) {
              await apiPut(`/api/skills/${skill.id}`, payload);
               showToast('Skill Draft 已更新；请发布 RuntimeRelease');
            } else {
              await apiPost('/api/skills', payload);
               showToast('Skill Draft 已创建；请绑定 Agent 并发布 RuntimeRelease');
            }
            closeModal();
            await loadSkills();
          } catch (err) {
            showToast('保存失败，请重试', 'error');
          }
        });
      }

      async function editSkill(skillId) {
        try {
          const data = await apiGet(`/api/skills/${skillId}`);
          openSkillModal(data.skill);
        } catch (err) {
          showToast('加载 Skill 失败', 'error');
        }
      }

      async function deleteSkill(skillId) {
        if (!confirm('确定要删除这个 Skill 吗？')) return;
        try {
          await apiDelete(`/api/skills/${skillId}`);
          showToast('Skill 已从 Draft 删除；已发布会话快照不受影响');
          await loadSkills();
        } catch (err) {
          showToast('删除失败，请重试', 'error');
        }
      }

      async function testSkill(skillId) {
        let agents = [];
        try { agents = (await apiGet('/api/agents')).agents || []; } catch (_) { /* binding check remains optional */ }
        const body = `
          ${formTextarea('测试问题', 'skill-test-query', '', '输入一个会触发该 Skill 的问题', 3)}
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">目标 Agent（建议选择，用于验证绑定与冲突）</label>
            <select id="skill-test-agent" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm">
              <option value="">仅诊断触发条件</option>
              ${agents.filter(agent => agent.enabled).map(agent => `<option value="${escapeHtml(agent.agent_id)}">${escapeHtml(agent.name)}（${escapeHtml(agent.agent_id)}）</option>`).join('')}
            </select>
          </div>
          <p class="text-xs text-slate-500">这是确定性运行时诊断，不调用模型、不消耗 Token；它会告诉你该 Skill 是否真的会在该 Agent 的下一轮对话中注入。</p>
        `;
        openModal('测试 Skill', body, async () => {
          const query = $('#skill-test-query').value.trim();
          if (!query) {
            showToast('请输入测试问题', 'error');
            return;
          }
          try {
            const data = await apiPost(`/api/skills/${skillId}/test`, { message: query, agent_id: $('#skill-test-agent').value || null });
            closeModal();
            const decision = data.decision || {};
            const selected = data.will_inject;
            const statusClass = selected ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-amber-50 border-amber-200 text-amber-800';
            const html = `
              <div class="space-y-3">
                <div class="bg-slate-50 rounded-xl p-3 border border-slate-200"><p class="text-[10px] text-slate-400 mb-1">测试问题</p><p class="text-sm text-slate-800">${escapeHtml(query)}</p></div>
                <div class="${statusClass} rounded-xl p-3 border"><p class="font-medium text-sm">${selected ? '会在下一轮对话中注入' : '不会注入'}</p><p class="text-xs mt-1">${escapeHtml(decision.match_reason || '')}</p><p class="text-xs mt-1">Agent 绑定：${escapeHtml(data.binding || 'not_checked')}；候选选择：${(data.selected_skill_ids || []).join('、') || '无'}</p></div>
                <div class="bg-slate-50 rounded-xl p-3 border border-slate-200 text-xs text-slate-600"><p><b>权限边界：</b>${escapeHtml(data.authority_note || '')}</p><p class="mt-1"><b>版本：</b>${escapeHtml(((decision.contract || {}).version) || 'legacy-1.0.0')}；优先级：${escapeHtml(String((decision.contract || {}).priority ?? 50))}</p></div>
                <div class="bg-brand-50 rounded-xl p-3 border border-brand-100"><p class="text-[10px] text-brand-500 mb-1">${selected ? '将被注入的指令预览' : '未注入原因'}</p><pre class="text-xs text-slate-700 whitespace-pre-wrap">${escapeHtml(data.instructions_preview || '')}</pre></div>
              </div>
            `;
            openModal('运行时诊断结果', html, null, '关闭');
          } catch (err) {
            showToast('测试失败', 'error');
          }
        }, '运行测试');
      }

      async function showSkillVersions(skillId) {
        try {
          const data = await apiGet(`/api/skills/${skillId}/versions`);
          const versions = data.versions || [];
          const body = `
            <div class="space-y-3 max-h-[60vh] overflow-y-auto">
              <div class="rounded-xl bg-brand-50 border border-brand-100 p-3 text-xs text-slate-600">版本是 Skill 的业务方法审计记录。回滚会生成一个新的版本，不会篡改历史版本；回滚后请用“测试”确认命中与绑定。</div>
              ${versions.length ? versions.map(version => `
                <div class="rounded-xl border border-slate-200 p-3">
                  <div class="flex items-start justify-between gap-3"><div><p class="font-medium text-sm text-slate-800">v${escapeHtml(version.version)}</p><p class="text-xs text-slate-500 mt-1">${escapeHtml(version.change_summary || '历史快照')} · ${escapeHtml(version.created_at || '')}</p><p class="text-xs text-slate-500 mt-1">触发：${escapeHtml((version.snapshot_summary || {}).trigger_condition || '未配置')}</p></div><button data-version="${escapeHtml(version.version)}" class="skill-version-rollback text-xs px-3 py-1.5 border border-amber-300 text-amber-700 rounded-lg hover:bg-amber-50">回滚到此版</button></div>
                </div>`).join('') : '<p class="text-sm text-slate-500">暂无版本记录</p>'}
            </div>`;
          openModal('Skill 版本与回滚', body, null, '关闭');
          $$('.skill-version-rollback').forEach(button => button.addEventListener('click', async () => {
            const version = button.dataset.version;
            if (!confirm(`确认回滚到 v${version}？系统会保留当前版本，并创建新的回滚版本。`)) return;
            try {
              await apiPost(`/api/skills/${skillId}/versions/${encodeURIComponent(version)}/rollback`, {});
              showToast('已回滚，请重新运行 Skill 诊断');
              closeModal();
              await loadSkills();
            } catch (err) { showToast('回滚失败：' + err.message, 'error'); }
          }));
        } catch (err) {
          showToast('加载版本失败', 'error');
        }
      }

      async function exportSkill(skillId) {
        try {
          const res = await fetch(`${API_BASE}/api/skills/${skillId}/export`);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `skill-${skillId}.zip`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('Skill 导出成功');
        } catch (err) {
          showToast('导出失败', 'error');
        }
      }

      async function manageSkillFiles(skillId) {
        try {
          const data = await apiGet(`/api/skills/${skillId}/files`);
          const files = data.files || [];
          const body = `
            <div class="space-y-4">
              <div class="flex gap-2">
                <input type="file" id="skill-file-input" class="flex-1 text-sm">
                <button type="button" id="skill-file-upload" class="px-3 py-2 bg-brand-600 text-white rounded-lg text-xs">上传</button>
              </div>
              <div class="space-y-2 max-h-80 overflow-y-auto">
                ${files.length === 0 ? '<p class="text-sm text-slate-500">暂无文件</p>' : files.map(f => `
                  <div class="flex items-center justify-between bg-slate-50 rounded-lg p-2 border border-slate-200">
                    <span class="text-sm text-slate-700">${escapeHtml(f)}</span>
                    <button type="button" data-path="${escapeHtml(f)}" class="skill-file-delete text-xs text-red-600 hover:underline">删除</button>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
          openModal('Skill 文件管理', body, null, '关闭');

          $('#skill-file-upload')?.addEventListener('click', async () => {
            const input = $('#skill-file-input');
            if (!input.files || input.files.length === 0) return;
            const form = new FormData();
            form.append('file', input.files[0]);
            try {
              const res = await fetch(`${API_BASE}/api/skills/${skillId}/files`, { method: 'POST', body: form });
              if (!res.ok) throw new Error('HTTP ' + res.status);
              showToast('上传成功');
              closeModal();
              await manageSkillFiles(skillId);
            } catch (err) {
              showToast('上传失败', 'error');
            }
          });

          $$('.skill-file-delete').forEach(btn => {
            btn.addEventListener('click', async () => {
              if (!confirm('确定删除该文件？')) return;
              try {
                await apiDelete(`/api/skills/${skillId}/files/${encodeURIComponent(btn.dataset.path)}`);
                showToast('删除成功');
                closeModal();
                await manageSkillFiles(skillId);
              } catch (err) {
                showToast('删除失败', 'error');
              }
            });
          });
        } catch (err) {
          showToast('加载文件失败', 'error');
        }
      }

      function openImportModal() {
        const body = `
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Git 仓库地址</label>
              <input id="skill-import-git" type="text" placeholder="https://github.com/user/skill-repo.git" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-400 focus:ring-2 focus:ring-brand-100">
            </div>
            <div class="text-center text-xs text-slate-400">— 或 —</div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">本地 zip 文件</label>
              <input type="file" id="skill-import-zip" accept=".zip" class="w-full text-sm">
            </div>
          </div>
        `;
        openModal('导入 Skill', body, async () => {
          const gitUrl = $('#skill-import-git').value.trim();
          const zipInput = $('#skill-import-zip');
          try {
            if (gitUrl) {
              await apiPost('/api/skills/import-git', { git_url: gitUrl });
              showToast('Git 导入成功');
            } else if (zipInput.files && zipInput.files.length > 0) {
              const form = new FormData();
              form.append('file', zipInput.files[0]);
              const res = await fetch(`${API_BASE}/api/skills/import-zip`, { method: 'POST', body: form });
              if (!res.ok) throw new Error('HTTP ' + res.status);
              showToast('Zip 导入成功');
            } else {
              showToast('请输入 Git 地址或选择 zip 文件', 'error');
              return;
            }
            closeModal();
            await loadSkills();
          } catch (err) {
            showToast('导入失败', 'error');
          }
        }, '导入');
      }

      $('#skill-add-btn').addEventListener('click', () => openSkillModal());
      $('#skill-import-btn').addEventListener('click', openImportModal);
      await loadSkills();
    }

    async function renderMcpPage(container) {
      container.innerHTML = `
        <div class="max-w-6xl mx-auto p-4 md:p-6 space-y-5">
          <div class="max-w-6xl mx-auto pb-1">
            <div>
              <h2 class="text-xl font-semibold text-slate-900">能力配置 · MCP Server（外部能力接入服务）/ Tool</h2>
              <p class="text-sm text-slate-500 mt-1">MCP Server负责接入外部能力，Tool是其中可调用的具体能力；Agent绑定与RuntimeRelease共同决定新会话能否使用。</p>
            </div>
          </div>
          <div class="rounded-2xl border border-indigo-200 bg-indigo-50 p-4 text-sm text-indigo-950"><b>能力边界：</b>MCP/Tool不等于ActionGateway。MCP/Tool负责读取或准备外部结果；本Demo的工单写入由应用层ActionGateway执行，必须经过用户确认并返回正式Receipt（回执）。</div>
          <div id="mcp-content">${loadingState()}</div>
          <details class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
            <summary class="cursor-pointer text-sm font-semibold text-slate-800">高级管理：接入新的MCP Server</summary>
            <p class="mt-2 text-xs text-slate-500">导入、连接、配置Tool模板或启停只修改Draft和接入状态，不调用模型、不发布RuntimeRelease；发布后仅新会话可用。</p>
            <div class="mt-3 flex gap-2"><button id="mcp-advanced-add-btn" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl text-sm">手动配置MCP Server</button><button id="mcp-git-import-btn" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-sm">从Git导入MCP Server</button></div>
