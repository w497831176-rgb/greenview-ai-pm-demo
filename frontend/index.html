	        return `<span class="text-xs px-2 py-1 rounded-full border ${colors}">${escapeHtml(srcLabel || '自动发现')}</span>`;
	      }


	      function renderReadableText(value, emptyText = '暂无记录', limit = 420) {
	        const text = String(value || '').trim();
	        if (!text) return `<p class="text-sm text-slate-400">${escapeHtml(emptyText)}</p>`;
	        if (text.length <= limit) return `<div class="text-sm leading-6 text-slate-700 whitespace-pre-wrap">${escapeHtml(text)}</div>`;
	        return `<div class="text-sm leading-6 text-slate-700 whitespace-pre-wrap">${escapeHtml(text.slice(0, limit))}…</div><details class="mt-2"><summary class="text-xs text-brand-600 cursor-pointer">展开全文</summary><div class="mt-2 text-sm leading-6 text-slate-700 whitespace-pre-wrap">${escapeHtml(text)}</div></details>`;
	      }


	      function lifecycleSummary(action) {
	        const detail = action.action_detail_parsed || {};
	        if (action.action_type === 'classify') return `人工分类：${detail.category || detail.root_cause_domain || '已记录'}`;
	        if (action.action_type === 'darwin-fix') return `完成一次专家分析 · Trace ${detail.darwin_trace_id || '-'}`;
	        if (action.action_type === 'apply-agent-config') return `${detail.agent_id || 'Agent'} 路由配置经人工审核后应用，Skill/RAG/MCP 绑定未变`;
	        if (action.action_type === 'runtime-release') return `${detail.version || '-'} / ${detail.release_id || '-'}`;
	        if (action.action_type === 'evaluation-retest') return `Run #${detail.evaluation_run_id || '-'} · ${detail.result || '-'} · Trace ${detail.trace_id || '-'}`;
	        if (action.action_type === 'verify') return detail.passed ? '复测证据通过，进入发布观察' : '验证不通过，重新打开修复';
	        if (action.action_type === 'close') return detail.observation_note || '人工观察后关闭';
	        return detail.note || detail.reason || '已记录';
	      }

      function sourceBadge(src) {
        const map = {
          realtime: '实时账单',
          estimated: '本地估算',
          fallback: '回退估算',
          unknown: '未知'
        };
        const label = map[src] || src || '未知';
        const color = src === 'realtime' ? 'bg-indigo-50 text-indigo-600' : src === 'estimated' ? 'bg-brand-50 text-brand-600' : 'bg-slate-100 text-slate-500';
        return `<span class="text-[10px] px-1.5 py-0.5 rounded-full ${color}">${escapeHtml(label)}</span>`;
      }

      function statusBadgeSmall(s) {
        const map = { success: ['bg-green-50 text-green-600', '成功'], error: ['bg-red-50 text-red-600', '失败'], warning: ['bg-amber-50 text-amber-600', '警告'] };
        const [cls, label] = map[s] || ['bg-slate-100 text-slate-500', s || '未知'];
        return `<span class="text-[10px] px-1.5 py-0.5 rounded-full ${cls}">${escapeHtml(label)}</span>`;
      }

      function parseDarwin(da) {
        if (!da) return null;
        try {
          return typeof da === 'string' ? JSON.parse(da) : da;
        } catch (e) {
          return null;
        }
      }

      function renderContextValue(v) {
        if (v === null || v === undefined) return '<span class="text-slate-400">-</span>';
        if (Array.isArray(v)) {
          const items = v.map(x => (typeof x === 'string' ? escapeHtml(x) : escapeHtml(JSON.stringify(x)))).join('、');
          return items ? `<div class="text-sm text-slate-700">${items}</div>` : '<span class="text-slate-400">-</span>';
        }
        if (typeof v === 'object') {
          return `<pre class="text-xs bg-slate-50 p-2 rounded border border-slate-200 overflow-x-auto">${escapeHtml(JSON.stringify(v, null, 2))}</pre>`;
        }
        return `<div class="text-sm text-slate-700 whitespace-pre-wrap">${escapeHtml(String(v))}</div>`;
      }

      function renderKeyValue(obj) {
        if (!obj || typeof obj !== 'object' || Object.keys(obj).length === 0) {
          return '<p class="text-sm text-slate-400">-</p>';
        }
        return `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${Object.entries(obj).map(([k, v]) => `
              <div class="bg-slate-50 rounded-lg p-3 border border-slate-200">
                <div class="text-xs text-slate-500 mb-1">${escapeHtml(k)}</div>
                ${renderContextValue(v)}
              </div>
            `).join('')}
          </div>
        `;
      }

      function renderDetail(detail) {
        if (!detail || typeof detail !== 'object' || Object.keys(detail).length === 0) return '';
        const lines = Object.entries(detail).map(([k, v]) => {
          let text;
          if (v === null || v === undefined) text = '-';
          else if (typeof v === 'object') text = JSON.stringify(v, null, 2);
          else text = String(v);
          return `<div class="text-xs text-slate-600"><span class="font-medium text-slate-700">${escapeHtml(k)}:</span> <span class="whitespace-pre-wrap">${escapeHtml(text)}</span></div>`;
        }).join('');
        return `<div class="mt-1 pl-2 border-l border-slate-200 space-y-0.5">${lines}</div>`;
      }

      function transitionBadge(before, beforeLabel, after, afterLabel) {
        const styleMap = {
          pending: 'bg-amber-50 text-amber-700 border-amber-200',
          classified: 'bg-indigo-50 text-indigo-700 border-indigo-200',
          fixing: 'bg-brand-50 text-brand-700 border-brand-200',
          verifying: 'bg-sky-50 text-sky-700 border-sky-200',
          closed: 'bg-slate-100 text-slate-600 border-slate-200',
          rejected: 'bg-red-50 text-red-700 border-red-200'
        };
        const beforeClass = styleMap[before] || 'bg-slate-100 text-slate-600 border-slate-200';
        const afterClass = styleMap[after] || 'bg-slate-100 text-slate-600 border-slate-200';
        return `<span class="px-2 py-0.5 rounded-full text-[10px] font-medium border ${beforeClass}">${escapeHtml(beforeLabel || before)}</span><span class="text-slate-400">→</span><span class="px-2 py-0.5 rounded-full text-[10px] font-medium border ${afterClass}">${escapeHtml(afterLabel || after)}</span>`;
      }

      function draftField(type, d) {
        if (type === 'knowledge') return d.content || '';
        if (type === 'skill_prompt') return d.prompt_content || '';
        return d.description || '';
      }

      function draftFields(type, d) {
        if (type === 'knowledge') {
          return [
            { key: 'title', label: '标题', value: d.title || '' },
            { key: 'content', label: '正文', value: d.content || '', textarea: true },
            { key: 'category', label: '分类', value: d.category || '' }
          ];
        }
        if (type === 'skill_prompt') {
          return [
            { key: 'title', label: '标题', value: d.title || '' },
            { key: 'skill_name', label: 'Skill 名称', value: d.skill_name || '' },
            { key: 'prompt_content', label: 'Prompt 内容', value: d.prompt_content || '', textarea: true },
            { key: 'trigger_keywords', label: '触发关键词', value: d.trigger_keywords || '' }
          ];
        }
        return [
          { key: 'title', label: '标题', value: d.title || '' },
          { key: 'description', label: '缺口描述', value: d.description || '', textarea: true },
          { key: 'gap_type', label: '缺口类型', value: d.gap_type || '' },
          { key: 'suggested_action', label: '建议动作', value: d.suggested_action || '', textarea: true }
        ];
      }

      function draftEndpoint(type) {
        if (type === 'knowledge') return 'knowledge-drafts';
        if (type === 'skill_prompt') return 'skill-prompt-drafts';

      }

          </div>
        `).join('');
        openModal(`${escapeHtml(draftStatusLabels[d.status] || d.status)} - ${escapeHtml(d.title || '草稿')}`, body, () => closeModal(), '关闭');

      function openDraftEdit(d, type) {

              : `<input id="draft-edit-${f.key}" type="text" value="${escapeHtml(f.value)}" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-400">`}

        openModal(`编辑${type === 'knowledge' ? '知识' : type === 'skill_prompt' ? 'Skill/Prompt' : '能力缺口'}草稿`, body, async () => {
          const payload = {};

          try {
            await apiPut(`/api/badcases/${id}/${draftEndpoint(type)}/${d.id}`, payload);

        } else {

          if (status === 'draft') {

            actionButtons += `<button data-draft-id="${d.id}" data-draft-type="${type}" data-review="rejected" class="badcase-draft-review px-2 py-1 bg-red-50 hover:bg-red-100 text-red-700 rounded-lg text-xs transition-colors" ${allowed.has('review-draft') ? '' : 'disabled title="当前状态不可审核"'}>驳回</button>`;

            actionButtons += `<button data-draft-id="${d.id}" data-draft-type="${type}" data-review="draft" class="badcase-draft-review px-2 py-1 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded-lg text-xs transition-colors" ${allowed.has('review-draft') ? '' : 'disabled title="当前状态不可审核"'}>退回草稿</button>`;
            actionButtons += `<button data-draft-id="${d.id}" data-draft-type="${type}" data-review="rejected" class="badcase-draft-review px-2 py-1 bg-red-50 hover:bg-red-100 text-red-700 rounded-lg text-xs transition-colors" ${allowed.has('review-draft') ? '' : 'disabled title="当前状态不可审核"'}>驳回</button>`;
          } else if (status === 'approved') {

              actionButtons += `<button data-draft-id="${d.id}" data-draft-type="${type}" data-confirm="${escapeHtml(applyConfirm.knowledge)}" class="badcase-draft-apply px-2 py-1 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs transition-colors">应用到正式知识库</button>`;

          { key: 'repair_path_suggestion', label: '修复路径建议' },
          { key: 'recommended_category', label: '推荐分类' },

      async function loadDetail() {
        try {
          await loadAgentsList();
          const data = await apiGet(`/api/badcases/${id}`);
          const bc = data.badcase || data;
          allowed = new Set(bc.allowed_actions || []);
          isTerminal = bc.is_terminal;
          category = bc.category || 'pending';
          const headerStatus = $('#badcase-detail-header-status');
          if (headerStatus) {
            headerStatus.innerHTML = `状态：<span class="text-slate-700 font-medium">${escapeHtml(bc.user_status_label || '待审核')}</span>${bc.terminal_outcome_label ? ` · ${escapeHtml(bc.terminal_outcome_label)}` : ''}`;
          }
	          const kDrafts = bc.knowledge_drafts || [];
	          const sDrafts = bc.skill_prompt_drafts || [];
	          const cDrafts = bc.capability_gap_drafts || [];
	          const darwinParsed = bc.darwin_analysis_parsed || parseDarwin(bc.darwin_analysis);
	          const actions = bc.actions || [];
	          const applyAction = [...actions].reverse().find(a => a.action_type === 'apply-agent-config');
	          const applyDetail = applyAction ? (applyAction.action_detail_parsed || {}) : null;
	          const releaseAction = [...actions].reverse().find(a => a.action_type === 'runtime-release');
	          const releaseDetail = releaseAction ? (releaseAction.action_detail_parsed || {}) : null;
	          const evaluationRuns = [...(bc.linked_evaluation_runs || [])].sort((a, b) => Number(a.id || 0) - Number(b.id || 0));

          const categoryDraftMap = {
            knowledge_gap: { label: '提取知识草稿', action: 'extract-knowledge', path: `/api/badcases/${id}/extract-knowledge` },
            skill_prompt: { label: '生成 Skill/Prompt 草稿', action: 'darwin-fix', path: `/api/badcases/${id}/darwin-fix` },

            routing: { label: '生成修复计划草稿', action: 'darwin-fix', path: `/api/badcases/${id}/darwin-fix` },
            response_quality: { label: '生成修复计划草稿', action: 'darwin-fix', path: `/api/badcases/${id}/darwin-fix` }
          };
          const catDraft = categoryDraftMap[category];

          function actionBtn(label, actionId, opts = {}) {
            const { cls = 'w-full px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm transition-colors', id = null, disabledTitle = '当前状态不可执行该操作' } = opts;

    async function renderBadcaseDetailPage(container) {

            controls = `<div class="space-y-3"><div class="text-sm font-medium text-slate-900">人工处理</div><div class="grid grid-cols-1 md:grid-cols-2 gap-3"><label class="text-xs text-slate-600">人工分类<select id="badcase-human-category" class="mt-1 w-full px-3 py-2 border border-slate-200 rounded-xl bg-white">${options}</select></label><label class="text-xs text-slate-600">采用依据<input id="badcase-human-reason" value="${escapeHtml(suggestedRootCause)}" placeholder="写明人工判断" class="mt-1 w-full px-3 py-2 border border-slate-200 rounded-xl"></label></div><div class="flex flex-wrap gap-2"><button id="badcase-ai-suggest" class="px-3 py-2 rounded-xl bg-violet-600 text-white text-sm">生成AI处理建议（Darwin · Pro）</button><button id="badcase-adopt" class="px-3 py-2 rounded-xl bg-brand-600 text-white text-sm">采用建议并进入处理</button><button id="badcase-reject" class="px-3 py-2 rounded-xl bg-slate-100 text-slate-700 text-sm">人工驳回并关闭</button></div><p class="text-xs text-slate-500">AI 只生成建议，不改变分类、状态或配置；只有人工按钮会推进状态。</p></div>`;

scapeHtml(bc.retest_trace_id)}</button>` : ''}</div></div><div class="bg-white border border-slate-200 rounded-2xl p-5">${controls}</div><div class="bg-white border border-slate-200 rounded-2xl p-5"><div class="font-medium text-slate-900 mb-3">处理建议</div>${suggestionHtml}</div><details class="bg-white border border-slate-200 rounded-2xl p-4"><summary class="cursor-pointer text-sm font-medium text-slate-700">高级证据与历史动作</summary><pre class="mt-3 text-xs whitespace-pre-wrap overflow-auto max-h-96">${escapeHtml(JSON.stringify({ trigger_code: context.trigger_code, component: context.component, release_id: context.release_id, actions }, null, 2))}</pre></details></div>`;

          if (retest) retest.addEventListener('click', () => {
            if (!window.confirm('确认运行一次真实复测？这会调用当前聊天主链并可能产生 Provider 成本。')) return;
            mutate(`/api/badcases/${id}/retest`, {}, '复测完成，请查看新 Trace 后人工确认结论');
          });
          const reject = $('#badcase-reject');
          if (reject) reject.addEventListener('click', () => {
            const reason = window.prompt('请填写人工关闭理由');
            if (reason && reason.trim()) mutate(`/api/badcases/${id}/reject`, { rejected_reason: reason.trim(), review_result: 'operator_rejected' }, '已由人工关闭');
          });
        } catch (err) {
          $('#badcase-detail-content').innerHTML = emptyState('加载详情失败：' + escapeHtml(err.message));
        }
      }
      await loadDetail();
    }


    async function renderLegacyEvaluationsPage(container) {
      container.innerHTML = loadingState();
      const state = { summary: {}, cases: [], agents: [] };
      const caseStateLabel = { draft: '草稿', active: '已启用', archived: '已归档' };
      const runStateLabel = { passed: '通过', failed: '失败', needs_manual_review: '待人工评审', error: '运行异常' };
      const colorForCase = status => ({ draft: 'bg-slate-100 text-slate-600', active: 'bg-emerald-50 text-emerald-700', archived: 'bg-amber-50 text-amber-700' }[status] || 'bg-slate-100 text-slate-600');
      const colorForRun = status => ({ passed: 'bg-emerald-50 text-emerald-700', failed: 'bg-red-50 text-red-700', needs_manual_review: 'bg-amber-50 text-amber-700', error: 'bg-red-50 text-red-700' }[status] || 'bg-slate-100 text-slate-600');
      const badge = (label, cls) => `<span class="text-[10px] px-2 py-1 rounded-full ${cls}">${escapeHtml(label || '-')}</span>`;
      const money = value => value === null || value === undefined ? '—' : `¥${Number(value).toFixed(6)}`;
      const commaList = value => String(value || '').split(/[，,]/).map(item => item.trim()).filter(Boolean);
      const runtimeStatusLabels = {
        complete: '正常完成回复',
        paused: '等待业主确认',
        completed: '受控写入完成'
      };
      const expectedRuntimeStatus = item => String(item?.rubric?.deterministic_assertions?.expected_runtime_status || 'complete');
      const runtimeStatusText = value => `${runtimeStatusLabels[value] || '未知本轮结果'}（${value || '未记录'}）`;
      const ruleValueText = (rule, field) => {
        const value = rule[field];
        if (rule.key === 'runtime_status') return runtimeStatusText(value);
        return typeof value === 'object' ? JSON.stringify(value) : String(value ?? '—');
      };

      async function loadAll() {
        const [overviewData, casesData, agentsData] = await Promise.all([
          apiGet('/api/evaluations/overview'),
          apiGet('/api/evaluations/cases'),
          apiGet('/api/agents')
        ]);
        state.summary = overviewData.summary || {};
        state.cases = casesData.cases || [];
        state.agents = agentsData.agents || [];
      }

      function expectationLine(label, values) {
        const list = Array.isArray(values) ? values : (values ? [values] : []);
        return `<div><span class="text-slate-500">${escapeHtml(label)}：</span>${list.length ? escapeHtml(list.join('、')) : '<span class="text-slate-400">未设门槛</span>'}</div>`;
      }

      function expectedBusinessSummary(item) {
        const parts = [`本轮结果：${runtimeStatusText(expectedRuntimeStatus(item))}`];
        if ((item.required_terms || []).length) parts.push(`回答包含：${item.required_terms.join('、')}`);
        if (item.expected_agent_id) parts.push(`Agent：${item.expected_agent_id}`);
        if ((item.expected_skills || []).length) parts.push(`Skill：${item.expected_skills.join('、')}`);
        if ((item.expected_citation_docs || []).length) parts.push(`RAG：${item.expected_citation_docs.join('、')}`);
        if ((item.expected_tools || []).length) parts.push(`Tool：${item.expected_tools.join('、')}`);
        if (item.expected_handoff !== null && item.expected_handoff !== undefined) parts.push(item.expected_handoff ? '必须转人工' : '不应转人工');
        if (item.rubric?.operator_rubric) parts.push(`人工标准：${item.rubric.operator_rubric}`);
        return parts.join('；') || '由人工评审业务结果';
      }

      async function openCase(caseId) {
        try {
          const data = await apiGet(`/api/evaluations/cases/${caseId}`);
          const item = data.case || {};
          const runs = data.runs || [];
          const requirements = `<div class="space-y-2 text-xs text-slate-700">
            <div><span class="text-slate-500">预期本轮结果：</span>${escapeHtml(runtimeStatusText(expectedRuntimeStatus(item)))}</div>
            ${expectationLine('预期 Agent', item.expected_agent_id)}
            ${expectationLine('预期 Skill', item.expected_skills)}
            ${expectationLine('预期 Tool/MCP', item.expected_tools)}
            ${expectationLine('预期知识证据', item.expected_citation_docs)}
            ${expectationLine('必须表达', item.required_terms)}
            ${expectationLine('禁止表达', item.forbidden_terms)}
            ${item.expected_handoff === null || item.expected_handoff === undefined ? '<div><span class="text-slate-500">人工接管：</span><span class="text-slate-400">未设门槛</span></div>' : `<div><span class="text-slate-500">人工接管：</span>${item.expected_handoff ? '必须进入' : '不应进入'}</div>`}
          </div>`;
          const runHtml = runs.length ? `<div class="space-y-3">${runs.map(run => {
            const rules = run.rule_results || [];
            const runtimeStatusRule = rules.find(rule => rule.key === 'runtime_status');
            const evidence = run.evidence || {};
            const decisions = evidence.decision_summary || {};
            const testedRules = rules.filter(rule => rule.status === 'pass' || rule.status === 'fail');
            const passedRules = testedRules.filter(rule => rule.status === 'pass').length;
            const evidenceLine = [
              `Agent ${evidence.current_agent_id || '未记录'}`,
              `Skill ${(evidence.activated_skills || []).join('、') || '跳过/无'}`,
              `RAG ${(decisions.rag || {}).status || '未记录'}`,
              `Tool ${(evidence.tool_names || []).join('、') || '跳过/无'}`,
              `Citation ${(evidence.citations || []).length}`,
              `Handoff ${evidence.handoff ? (evidence.handoff_reason || '是') : '否'}`
            ].join(' · ');
            return `<div class="border border-slate-200 rounded-xl p-3 space-y-2">
              <div class="flex items-center justify-between gap-2"><div class="font-medium text-sm text-slate-900">运行 #${escapeHtml(String(run.id))} · ${escapeHtml(formatTimeLabel(run.created_at))}</div>${badge(runStateLabel[run.status] || run.status, colorForRun(run.status))}</div>
              <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
                <div class="rounded-lg bg-slate-50 p-3"><div class="text-[11px] font-semibold text-slate-500">1 · 人工创建用例</div><div class="mt-1 text-xs text-slate-700 line-clamp-4">${escapeHtml(item.user_message || '未记录输入')}</div></div>
                <div class="rounded-lg bg-indigo-50 p-3"><div class="text-[11px] font-semibold text-indigo-600">2 · 预期</div><div class="mt-1 text-xs text-indigo-900 line-clamp-4">${escapeHtml(expectedBusinessSummary(item))}</div></div>
                <div class="rounded-lg bg-slate-50 p-3"><div class="text-[11px] font-semibold text-slate-500">3 · 实际</div><div class="mt-1 text-xs font-medium text-slate-800">本轮结果：${escapeHtml(runtimeStatusRule ? runtimeStatusText(runtimeStatusRule.actual) : '未记录')}</div><div class="mt-1 text-xs text-slate-700 line-clamp-4 whitespace-pre-wrap">${escapeHtml(run.answer || '未保存回答正文')}</div></div>
                <div class="rounded-lg ${run.status === 'passed' ? 'bg-emerald-50' : run.status === 'failed' ? 'bg-red-50' : 'bg-amber-50'} p-3"><div class="text-[11px] font-semibold ${run.status === 'passed' ? 'text-emerald-700' : run.status === 'failed' ? 'text-red-700' : 'text-amber-700'}">4 · 能力节点命中</div><div class="mt-1 text-xl font-semibold">${passedRules}/${testedRules.length}</div><div class="text-xs mt-1">${escapeHtml(runStateLabel[run.status] || run.status)}</div></div>
              </div>
              ${run.operator_judgement ? `<div class="text-xs bg-slate-50 p-2 rounded">人工评审：${escapeHtml(run.operator_judgement)} · ${escapeHtml(run.operator_note || '')}</div>` : ''}
              <details class="rounded-lg border border-slate-200 bg-slate-50 p-3"><summary class="cursor-pointer text-xs font-medium text-slate-700">高级证据：逐节点判定、Trace、Release 与用量</summary><div class="mt-3 space-y-2"><div class="text-[11px] text-slate-600">${escapeHtml(evidenceLine)}</div><div class="text-xs text-slate-500">Trace ${escapeHtml(run.trace_id || '未生成')} · RuntimeRelease ${escapeHtml(run.release_version || evidence.release_version || '未记录')} · Provider实际Token ${run.total_tokens ?? '不可得'} · 平台价格快照直接成本 ${money(run.estimated_cost_cny)}（非DeepSeek最终账单）</div>${rules.length ? `<div class="space-y-2">${rules.map(rule => `<div class="text-xs rounded-lg border p-2 ${rule.status === 'fail' ? 'border-red-200 bg-red-50 text-red-800' : rule.status === 'pass' ? 'border-emerald-100 bg-emerald-50 text-emerald-800' : 'border-slate-200 text-slate-600'}"><div class="font-medium">${rule.status === 'pass' ? '✓' : rule.status === 'fail' ? '×' : '•'} ${escapeHtml(rule.label)}</div><div class="mt-1"><span class="text-slate-500">预期：</span>${escapeHtml(ruleValueText(rule, 'expected'))}</div><div><span class="text-slate-500">实际：</span>${escapeHtml(ruleValueText(rule, 'actual'))}</div>${rule.note ? `<div class="mt-1">说明：${escapeHtml(rule.note)}</div>` : ''}</div>`).join('')}</div>` : ''}<div class="flex flex-wrap gap-2 pt-1">${run.trace_id ? `<button class="evaluation-open-trace text-xs px-2 py-1 bg-white hover:bg-slate-100 rounded-lg border border-slate-200" data-trace-id="${escapeHtml(run.trace_id)}">查看 Trace</button>` : ''}${run.status === 'needs_manual_review' ? `<button class="evaluation-review-run text-xs px-2 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl" data-run-id="${run.id}">人工评审</button>` : ''}${run.badcase_id ? `<span class="text-xs text-slate-500">已关联 Badcase #${escapeHtml(String(run.badcase_id))}</span>` : ''}${run.status === 'failed' && !run.badcase_id ? `<span class="text-xs text-red-600">Badcase 关联异常，请检查接口证据</span>` : ''}</div></div></details>
            </div>`;
        }).join('')}</div>` : '<p class="text-sm text-slate-400">尚未运行。只有操作员主动点击“运行真实链路”才会发起真实业务链路；链路内每次Provider请求独立记账。</p>';
          const actions = `<div class="flex flex-wrap gap-2">
            ${item.status === 'draft' ? `<button id="evaluation-activate" class="px-3 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm">启用用例</button>` : ''}
            ${item.status === 'active' ? `<button id="evaluation-run" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm">运行真实链路</button><button id="evaluation-archive" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm">归档</button>` : ''}
          </div>`;
          openDrawer(`Golden Set · ${item.case_key || item.id}`, `<div class="space-y-5"><div><div class="flex items-center gap-2"><h4 class="text-lg font-semibold text-slate-900">${escapeHtml(item.title || '-')}</h4>${badge(caseStateLabel[item.status] || item.status, colorForCase(item.status))}${badge(item.risk_level || 'L2', 'bg-violet-50 text-violet-700')}</div><p class="mt-2 text-sm text-slate-600 whitespace-pre-wrap">${escapeHtml(item.description || item.scenario || '人工创建的固定评估用例')}</p></div><div class="grid grid-cols-1 md:grid-cols-2 gap-3"><div class="bg-slate-50 border border-slate-200 rounded-xl p-3"><div class="text-xs text-slate-500 mb-1">用户会怎么问</div><div class="text-sm text-slate-800 whitespace-pre-wrap">${escapeHtml(item.user_message || '')}</div></div><div class="bg-indigo-50 border border-indigo-200 rounded-xl p-3"><div class="text-xs text-indigo-600 mb-1">预期结果</div><div class="text-sm text-indigo-950 whitespace-pre-wrap">${escapeHtml(expectedBusinessSummary(item))}</div></div></div><details class="rounded-xl border border-slate-200 bg-slate-50 p-3"><summary class="cursor-pointer text-sm font-medium text-slate-700">高级证据：完整预期门槛与审计配置</summary><div class="mt-3">${requirements}</div></details>${item.rubric && item.rubric.operator_rubric ? `<div class="text-xs text-amber-700 bg-amber-50 border border-amber-100 rounded-xl p-3">此用例含人工业务 Rubric。确定性规则通过后仍需人工记录判断依据。</div>` : ''}${item.rubric && item.rubric.controlled_failure_canary ? `<div class="text-xs text-red-700 bg-red-50 border border-red-100 rounded-xl p-3">这是验收用受控失败探针，不计入黄金集通过率。</div>` : ''}${actions}<div><h5 class="font-medium text-slate-900 mb-2">预期 → 实际 → 能力节点 → PASS / FAIL</h5>${runHtml}</div></div>`);
          setTimeout(() => {
            const activate = $('#evaluation-activate');
            if (activate) activate.addEventListener('click', async () => { await apiPut(`/api/evaluations/cases/${item.id}`, { status: 'active' }); await loadAll(); await openCase(item.id); showToast('用例已启用'); });
            const archive = $('#evaluation-archive');
            if (archive) archive.addEventListener('click', async () => { await apiPut(`/api/evaluations/cases/${item.id}`, { status: 'archived' }); await loadAll(); await openCase(item.id); showToast('用例已归档'); });
            const run = $('#evaluation-run');
            if (run) run.addEventListener('click', async () => {
              if (!window.confirm('这会以一条独立新会话运行真实业务链路；链路内可能产生多次Provider请求和实际Token，并按平台价格快照计算直接成本。确认继续？')) return;
              run.disabled = true; run.textContent = '运行中…';
              try { await apiPost(`/api/evaluations/cases/${item.id}/run`, {}); await loadAll(); await openCase(item.id); showToast('评估规则结果已生成'); }
              catch (err) { showToast('运行失败：' + err.message, 'error'); run.disabled = false; run.textContent = '运行真实链路'; }
            });
            $$('.evaluation-open-trace').forEach(button => button.addEventListener('click', () => openTraceDrawer(button.dataset.traceId)));
            $$('.evaluation-review-run').forEach(button => button.addEventListener('click', () => openReviewModal(Number(button.dataset.runId), item.id)));
          }, 0);
        } catch (err) { showToast('加载评估用例失败：' + err.message, 'error'); }
      }

      function openReviewModal(runId, caseId) {
        openModal('人工评审', `${formSelect('结论', 'evaluation-review-passed', [{ value: 'true', label: '通过' }, { value: 'false', label: '不通过' }], 'true')}${formTextarea('评审依据', 'evaluation-review-note', '', '例如：处理建议符合物业 SOP，但语气还需优化。', 4)}`, async () => {
          const note = $('#evaluation-review-note').value.trim();
          if (!note) { showToast('请填写人工评审依据', 'error'); return false; }
          try {
            await apiPost(`/api/evaluations/runs/${runId}/review`, { passed: $('#evaluation-review-passed').value === 'true', note });
            closeModal(); await loadAll(); await openCase(caseId); showToast('人工评审已记录'); return true;
          } catch (err) { showToast('评审保存失败：' + err.message, 'error'); return false; }
        }, '保存评审');
      }

      function openCreateModal() {
        const agentOptions = [{ value: '', label: '不设 Agent 硬门槛' }].concat(state.agents.filter(agent => !agent.is_router).map(agent => ({ value: agent.agent_id || agent.id, label: `${agent.name} (${agent.agent_id || agent.id})` })));
        const body = `
          <div class="rounded-xl border border-indigo-200 bg-indigo-50 p-3 text-xs text-indigo-800">人工填写并保存为草稿；创建不调用模型，也不会自动运行付费评估。</div>
          ${formInput('用例名称 *', 'evaluation-case-title', '', '如：漏水紧急维修全链路')}
          ${formTextarea('用户会怎么问 *', 'evaluation-case-message', '', '写入一条完整、可重复的真实业务问题。', 5)}
          ${formInput('预期结果至少包含 *', 'evaluation-case-required', '', '用逗号分隔，如：30分钟内到场,需要业主确认')}
          ${formTextarea('为什么要测这个场景', 'evaluation-case-description', '', '说明业务目的或风险。', 3)}
          <details class="rounded-xl border border-slate-200 bg-slate-50 p-3"><summary class="cursor-pointer text-sm font-medium text-slate-700">高级证据：Agent / Skill / RAG / MCP 等精确门槛</summary><div class="mt-3 space-y-3">
            ${formInput('技术用例编号（留空自动生成）', 'evaluation-case-key', '', '如：EVAL-LEAK-001')}
            ${formSelect('风险等级', 'evaluation-case-risk', [{ value: 'L1', label: 'L1 低风险' }, { value: 'L2', label: 'L2 一般业务' }, { value: 'L3', label: 'L3 高影响业务' }, { value: 'L4', label: 'L4 高风险边界' }], 'L2')}
            ${formSelect('来源', 'evaluation-case-source', [{ value: 'expert', label: '人工专家 / SOP' }, { value: 'badcase', label: 'Badcase 回归' }, { value: 'adversarial', label: '对抗测试' }, { value: 'synthetic', label: '人工编写的合成场景' }], 'expert')}
            ${formSelect('预期本轮结果', 'evaluation-case-runtime-status', [{ value: 'complete', label: '正常完成回复（complete，默认）' }, { value: 'paused', label: '等待业主确认（paused）' }, { value: 'completed', label: '受控写入完成（completed）' }], 'complete')}
            ${formSelect('预期 Agent', 'evaluation-case-agent', agentOptions, '')}
            ${formInput('预期 Skill（逗号分隔）', 'evaluation-case-skills', '', '如：维修工单处理')}
            ${formInput('预期 Tool / MCP（逗号分隔）', 'evaluation-case-tools', '', '如：get_current_weather,count_work_orders')}
            ${formInput('预期 RAG 引用文档（逗号分隔）', 'evaluation-case-citations', '', '如：常见维修问题 FAQ,物业维修服务承诺')}
            ${formInput('禁止出现的表达（逗号分隔）', 'evaluation-case-forbidden', '', '如：已立即创建工单')}
            ${formSelect('人工接管预期', 'evaluation-case-handoff', [{ value: '', label: '不设门槛' }, { value: 'false', label: '不应转人工' }, { value: 'true', label: '必须转人工' }], '')}
            ${formTextarea('人工评审标准（可选）', 'evaluation-case-rubric', '', '填写业务可用性、语气、SOP 等需要人工判断的标准。', 3)}
            ${formSelect('创建后状态', 'evaluation-case-status', [{ value: 'draft', label: '草稿（推荐，不允许运行）' }, { value: 'active', label: '启用（仍需人工点击运行）' }], 'draft')}
          </div></details>`;
        openModal('人工创建 Evaluation 用例', body, async () => {
          const title = $('#evaluation-case-title').value.trim();
          const userMessage = $('#evaluation-case-message').value.trim();
          const requiredTerms = commaList($('#evaluation-case-required').value);
          if (!title || !userMessage || !requiredTerms.length) { showToast('请填写用例名称、用户问题和预期结果', 'error'); return false; }
          const key = $('#evaluation-case-key').value.trim() || `MANUAL-${new Date().toISOString().replace(/\D/g, '').slice(0, 14)}`;
          const handoffValue = $('#evaluation-case-handoff').value;
          const rubricText = $('#evaluation-case-rubric').value.trim();
          const rubric = {
            deterministic_assertions: {
              expected_runtime_status: $('#evaluation-case-runtime-status').value
            }
          };
          if (rubricText) rubric.operator_rubric = rubricText;
          const payload = {
            case_key: key, title, user_message: userMessage,
            description: $('#evaluation-case-description').value.trim(), risk_level: $('#evaluation-case-risk').value,
            source: $('#evaluation-case-source').value, expected_agent_id: $('#evaluation-case-agent').value || null,
            expected_skills: commaList($('#evaluation-case-skills').value), expected_tools: commaList($('#evaluation-case-tools').value),
            expected_citation_docs: commaList($('#evaluation-case-citations').value), required_terms: requiredTerms,
            forbidden_terms: commaList($('#evaluation-case-forbidden').value), expected_handoff: handoffValue === '' ? null : handoffValue === 'true',
            rubric, status: $('#evaluation-case-status').value,
            version_label: APP_VERSION
          };
          try { await apiPost('/api/evaluations/cases', payload); closeModal(); await loadAll(); renderPage(); showToast('Evaluation 用例已创建；尚未运行模型'); return true; }
          catch (err) { showToast('创建失败：' + err.message, 'error'); return false; }
        }, '保存人工用例');
      }

      function renderPage() {
        const summary = state.summary || {};

    async function renderCostGovernancePage(container) {
      container.innerHTML = loadingState();

      const state = {
        filters: { model: '', stage: '', search: '', sortOrder: 'desc' },
        rangeKey: 'yesterday',
        customStart: '',
        customEnd: '',
        resolvedScope: null,
        pagination: { page: 1, pages: 1, total: 0, limit: 20, hasPrevious: false, hasNext: false },
        traceSummary: { traceGroupCount: 0, providerRequestCount: 0 },
        traceDataQuality: {},
        statisticsConsistent: null,
        usageSummary: { rows: [], total: {}, complete: true },
        overview: null,
        traces: [],
        trends: [],
        distribution: [],
        prices: [],
        budget: {},
        costCases: [],
      };

      function fmtTime(d) {
        if (!d) return '';
        return formatTimeLabel(d);
      }

      function beijingToday() {
        const parts = new Intl.DateTimeFormat('zh-CN', {
          timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
        }).formatToParts(new Date()).reduce((acc, part) => ({ ...acc, [part.type]: part.value }), {});
        return `${parts.year}-${parts.month}-${parts.day}`;
      }

      function shiftCalendarDate(dateText, dayOffset) {
        const [year, month, day] = String(dateText).split('-').map(Number);
        const shifted = new Date(Date.UTC(year, month - 1, day + dayOffset));
        return shifted.toISOString().slice(0, 10);
      }

      function beijingDateOffset(dayOffset) {
        return shiftCalendarDate(beijingToday(), dayOffset);
      }

      function beijingWeekStart() {
        const today = beijingToday();
        const [year, month, day] = today.split('-').map(Number);
        const weekday = new Date(Date.UTC(year, month - 1, day)).getUTCDay();
        return shiftCalendarDate(today, weekday === 0 ? -6 : 1 - weekday);
      }

      function scopeParams() {
        const params = new URLSearchParams();
        if (state.rangeKey === 'today') {
          const date = beijingToday();
          params.set('range_key', 'custom');
          params.set('start', date);
          params.set('end', date);
        } else if (state.rangeKey === 'yesterday' || state.rangeKey === 'day_before_yesterday') {
          const date = beijingDateOffset(state.rangeKey === 'yesterday' ? -1 : -2);
          params.set('range_key', 'custom');
          params.set('start', date);
          params.set('end', date);
        } else if (state.rangeKey === 'this_week') {
          params.set('range_key', 'custom');
          params.set('start', beijingWeekStart());
          params.set('end', beijingToday());
        } else if (state.rangeKey === 'this_month') {
          const today = beijingToday();
          params.set('range_key', 'custom');
          params.set('start', `${today.slice(0, 7)}-01`);
          params.set('end', today);
        } else if (state.rangeKey === 'custom') {
          params.set('range_key', 'custom');
          params.set('start', state.customStart);
          params.set('end', state.customEnd);
        } else {
          params.set('range_key', state.rangeKey);
        }
        return params;
      }
      function fmtCost(v) {
        if (v === null || v === undefined) return '金额无法计算';
        return '¥' + Number(v).toFixed(6);
      }
      function fmtContextTokens(v) {
        if (v === null || v === undefined || v === 0) return '不可得';
        return Number(v).toLocaleString();
      }
      function fmtTokens(v) {
        if (v === null || v === undefined) return '不可得';
        return Number(v).toLocaleString();
      }
      function sourceBadge(src) {
        if (src === 'provider_actual') return '<span class="px-1.5 py-0.5 bg-green-50 text-green-700 rounded text-[10px]">Provider真实用量</span>';
        if (src === 'estimated') return '<span class="px-1.5 py-0.5 bg-amber-50 text-amber-700 rounded text-[10px]">本地估算，非账单</span>';
        if (src === 'unavailable' || src === 'provider_reported_total_only') return '<span class="px-1.5 py-0.5 bg-slate-100 text-slate-600 rounded text-[10px]">金额无法计算</span>';
        return '<span class="px-1.5 py-0.5 bg-slate-100 text-slate-500 rounded text-[10px]">历史口径</span>';
      }
      function statusBadgeSmall(s) {
        if (s === 'success') return '<span class="text-green-600">成功</span>';
        if (s === 'failed') return '<span class="text-red-600">失败</span>';
        return '<span class="text-slate-500">' + escapeHtml(s || '-') + '</span>';
      }

      async function loadAll() {
        const usageParams = scopeParams();
        const traceParams = new URLSearchParams(usageParams.toString());
        if (state.filters.model) traceParams.set('model_id', state.filters.model);
        if (state.filters.stage) traceParams.set('stage', state.filters.stage);
        if (state.filters.search) traceParams.set('trace_id', state.filters.search);
        traceParams.set('limit', String(state.pagination.limit));
        traceParams.set('offset', String((state.pagination.page - 1) * state.pagination.limit));
        traceParams.set('sort_order', state.filters.sortOrder);
        const [usageSummary, traces] = await Promise.all([
          apiGet(`/api/observability/usage-summary?${usageParams.toString()}`),
          apiGet(`/api/observability/traces?${traceParams.toString()}`),
        ]);
        state.usageSummary = usageSummary || { rows: [], total: {}, complete: false };
        state.resolvedScope = usageSummary.scope || null;
        state.traces = traces.traces || [];
        state.traceRange = { start: traces.start || '', end: traces.end || '' };
        state.pagination = {
          page: Number(traces.page || 1),
          pages: Number(traces.pages || 1),
          total: Number(traces.total || 0),
          limit: Number(traces.limit || 20),
          hasPrevious: Boolean(traces.has_previous),
          hasNext: Boolean(traces.has_next),
        };
        state.traceSummary = {
          traceGroupCount: Number(traces.trace_group_count ?? traces.total ?? 0),
          providerRequestCount: Number(traces.provider_request_count ?? 0),
        };
        state.traceDataQuality = traces.data_quality || {};
        state.statisticsConsistent = Boolean(
          state.resolvedScope
          && String(state.resolvedScope.start || '') === String(traces.start || '')
          && String(state.resolvedScope.end || '') === String(traces.end || '')
        );
        state.trends = [];
        state.distribution = [];
      }

      async function reloadPage(options = {}) {
        container.innerHTML = loadingState();
        try {
          await loadAll(options);
          renderPage();
        } catch (err) {
          container.innerHTML = `
            <div class="max-w-3xl mx-auto p-6">
              <div class="rounded-2xl border border-red-200 bg-red-50 p-5">
                <h2 class="font-semibold text-red-800">Trace与成本加载失败</h2>
                <p class="mt-2 text-sm text-red-700">接口失败没有被转换成0次、¥0或“不适用”。请重试；若仍失败，请检查API健康状态。</p>
                <p class="mt-2 text-xs text-red-600">${escapeHtml(err && err.message ? err.message : '未知接口错误')}</p>
                <button id="cg-retry" type="button" class="mt-4 px-4 py-2 rounded-lg bg-red-700 text-white text-sm">重试</button>
              </div>
            </div>`;
          $('#cg-retry').addEventListener('click', () => reloadPage(options));
        }
      }

      function renderOverview() {
        const o = state.overview || {};
        const scope = o.scope || {};
        const calls = Number(o.provider_request_count ?? o.calls ?? 0);
        const traceGroupCount = Number(state.traceSummary.traceGroupCount ?? o.trace_group_count ?? 0);
        const knownUsage = o.known_usage || {};
        const dataQuality = o.data_quality || {};
        const tokens = o.total_tokens;
        const knownTokenCalls = Number(o.known_token_calls ?? o.known_usage_calls ?? 0);
        const unknownTokenCalls = Number(o.unknown_token_calls ?? 0);
        const estimatedCalls = Number(o.estimated_calls || 0);
        const unavailableCalls = Number(o.unavailable_calls || 0);
        const incompleteProviderActualUsageCalls = Number(dataQuality.provider_actual_usage_incomplete_count || 0);
        const unavailableProviderActualCostCalls = Number(dataQuality.provider_actual_cost_unavailable_count || 0);
        const missingProviderRequestIds = Number(dataQuality.provider_request_id_unavailable_count || 0);
        const conflictingProviderRequestIds = Number(dataQuality.provider_request_identity_conflict_count || 0);
        const duplicateProviderRequestIds = Number(dataQuality.duplicate_provider_request_id_count || 0);
        const confirmedProviderMetadataConflicts = Number(dataQuality.confirmed_provider_attempt_metadata_conflict_count || 0);
        const misclassifiedConfirmedProviderEvidence = Number(dataQuality.confirmed_provider_evidence_misclassified_count || 0);
        const unverifiedProviderActualModels = Number(dataQuality.provider_actual_model_unverified_count || 0);
        const conflictingProviderActualModels = Number(dataQuality.provider_actual_model_conflict_count || 0);
        const budgetUnavailable = o.budget_status === 'unavailable';
        const modelRows = Object.entries(o.by_model || {}).map(([modelId, row]) => ({ ...row, actual_model_id: String(modelId || '').toLowerCase() }));
        const flashCalls = modelRows.filter(row => row.actual_model_id === 'deepseek-v4-flash').reduce((sum, row) => sum + Number(row.calls || 0), 0);
        const proCalls = modelRows.filter(row => row.actual_model_id === 'deepseek-v4-pro').reduce((sum, row) => sum + Number(row.calls || 0), 0);
        const unknownModelCalls = Math.max(0, calls - flashCalls - proCalls);
        const darwinCalls = Number(((o.by_stage || {}).darwin || {}).calls || 0);
        const unexpectedPro = Math.max(0, proCalls - darwinCalls);
        const modelSummary = calls === 0
          ? '未调用模型'
          : unknownModelCalls > 0
            ? '模型身份待确认'
            : (flashCalls === calls ? '全部使用Flash' : (proCalls === calls ? '全部使用Pro' : '使用Flash与Pro'));
        const evidenceSummary = o.data_quality_status === 'normal' && estimatedCalls === 0 && unavailableCalls === 0 && unknownTokenCalls === 0 && incompleteProviderActualUsageCalls === 0 && unavailableProviderActualCostCalls === 0
          ? `当前纳入汇总的请求均有完整Provider实际Usage与平台价格快照。${budgetUnavailable ? ' 但今日或本月预算账本仍不可完整核实，后台可选付费能力已停止。' : ''}`
          : `其中历史估算 ${estimatedCalls} 次（排除Provider actual对账），Provider actual核心Usage不完整 ${incompleteProviderActualUsageCalls} 次，实际Usage不可得 ${unknownTokenCalls} 次，直接成本不可得 ${unavailableCalls} 次；数据质量异常attempt ${Number(dataQuality.anomaly_attempt_count || 0)} 条。`;
        const attention = o.statistics_status === 'data_quality_error'
          ? { label: '数据质量错误', tone: 'text-red-700 bg-red-50 border-red-200' }
          : o.statistics_status === 'reconciliation_attention'
            ? { label: '对账待处理', tone: 'text-amber-800 bg-amber-50 border-amber-200' }
          : state.statisticsConsistent === false
            ? { label: '统计口径异常', tone: 'text-red-700 bg-red-50 border-red-200' }
          : budgetUnavailable
            ? { label: '预算账本不可核实', tone: 'text-amber-800 bg-amber-50 border-amber-200' }
          : unexpectedPro > 0
          ? { label: '存在非预期Pro调用', tone: 'text-red-700 bg-red-50 border-red-200' }
          : unavailableCalls > 0
            ? { label: '有金额无法计算', tone: 'text-slate-700 bg-slate-50 border-slate-200' }
            : estimatedCalls > 0
              ? { label: '有估算费用', tone: 'text-amber-700 bg-amber-50 border-amber-200' }
              : { label: '正常', tone: 'text-emerald-700 bg-emerald-50 border-emerald-200' };
        const rangeLabel = scope.label || '所选范围';
        const sentenceLead = state.rangeKey === 'custom' ? `${rangeLabel}，共` : `${rangeLabel}共`;
        const cardPrefix = state.rangeKey === 'custom' ? '该期间' : rangeLabel;
        const tokenSummary = knownTokenCalls
          ? `${Number(tokens).toLocaleString()} Token${unknownTokenCalls ? `（另${unknownTokenCalls}次不可得）` : ''}`
          : (calls ? `不可得（${unknownTokenCalls || calls}次，不显示0）` : '不适用');
        const reasoningKnownCalls = Number(knownUsage.reasoning_known_calls || 0);
        const reasoningUnavailableCalls = Number(knownUsage.reasoning_unavailable_calls || 0);
        const reasoningRelationship = knownUsage.reasoning_is_output_subset === true
          ? '属于输出子集，不重复计入总量'
          : knownUsage.reasoning_is_output_subset === false
            ? '发现Reasoning大于Output或负值，Usage内部不一致'
            : '证据不足，无法核实是否为输出子集';
        const usageBreakdown = knownTokenCalls
          ? `缓存命中输入 ${Number(knownUsage.input_cache_hit_tokens || 0).toLocaleString()} · 缓存未命中输入 ${Number(knownUsage.input_cache_miss_tokens || 0).toLocaleString()} · 输出 ${Number(knownUsage.output_tokens || 0).toLocaleString()} · Reasoning ${reasoningKnownCalls ? Number(knownUsage.reasoning_tokens || 0).toLocaleString() : '不可得'}${reasoningUnavailableCalls ? `（另${reasoningUnavailableCalls}次不可得）` : ''}（${reasoningRelationship}）`
          : (calls ? 'Provider实际Usage拆分不可得，不显示0。' : '本范围没有Provider请求，Token不适用。');
        const directCost = o.platform_price_snapshot_direct_cost_cny !== null && o.platform_price_snapshot_direct_cost_cny !== undefined
          ? fmtCost(o.platform_price_snapshot_direct_cost_cny)
          : o.known_partial_cost_cny !== null && o.known_partial_cost_cny !== undefined
            ? `${fmtCost(o.known_partial_cost_cny)}（仅已知部分，完整成本不可核实）`
          : (calls ? '不可得（不显示¥0）' : '不适用');
        const qualityIssues = (dataQuality.anomaly_attempts || []).map(item => {
          const codes = (item.issue_codes || []).join(' / ') || 'cause_unconfirmed';
          return `<li class="mt-1"><span class="font-mono">${escapeHtml(item.trace_id_summary || 'trace-unassigned')}</span> · ${escapeHtml(item.stage || 'unknown')} · ${escapeHtml(codes)} · 去向：${item.included_in_provider_summary ? '正常Provider汇总' : `排除（${escapeHtml(item.exclusion_reason || 'cause_unconfirmed')}）`}</li>`;
        }).join('');
        const qualityPanel = o.data_quality_status === 'normal'
          ? '<div class="mt-3 rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-xs text-emerald-700">数据质量正常：坏时间、未决发送、已发送记录分类矛盾、Provider请求ID缺失/冲突/重复、实际模型缺失/冲突、Provider actual核心Usage缺失、Usage矛盾、实际Token缺价格、成本金额不可得与Usage不可得均为0。</div>'
          : `<div class="mt-3 rounded-lg border ${o.data_quality_status === 'data_quality_error' ? 'border-red-200 bg-red-50 text-red-700' : 'border-amber-200 bg-amber-50 text-amber-800'} px-3 py-2 text-xs"><div class="font-semibold">无法完整核实：${escapeHtml(o.data_quality_status || 'cause_unconfirmed')}</div><div class="mt-1">坏时间 ${Number(dataQuality.invalid_timestamp_count || 0)} · 发送未确认 ${Number(dataQuality.provider_send_unconfirmed_count || 0)} · 已发送Provider元数据矛盾 ${confirmedProviderMetadataConflicts} / 分类错误 ${misclassifiedConfirmedProviderEvidence} · Provider请求ID缺失 ${missingProviderRequestIds} / 冲突 ${conflictingProviderRequestIds} / 重复attempt ${duplicateProviderRequestIds} · 实际模型未核实 ${unverifiedProviderActualModels} / 冲突 ${conflictingProviderActualModels} · Provider actual核心Usage缺失 ${incompleteProviderActualUsageCalls} · Usage矛盾 ${Number(dataQuality.provider_usage_inconsistent_count || 0)} · 实际Token缺价格 ${Number(dataQuality.provider_actual_price_missing_count || 0)} · 快照完整但成本金额不可得 ${unavailableProviderActualCostCalls} · Usage不可得 ${Number(dataQuality.unavailable_usage_count || 0)}</div>${qualityIssues ? `<ul class="mt-2">${qualityIssues}</ul>` : ''}</div>`;
        const ranges = [
          ['today', '今天'], ['yesterday', '昨天'], ['last_7_days', '近7天'],
          ['this_month', '本月'], ['last_month', '上月'], ['custom', '自定义']
        ];

        return `
          <section class="bg-white rounded-2xl shadow-soft border border-slate-200 p-5" aria-labelledby="cg-summary-title">
            <div class="flex flex-wrap gap-2" aria-label="成本统计时间范围">
              ${ranges.map(([key, label]) => `<button type="button" data-range="${key}" class="cg-range-btn px-3 py-1.5 rounded-lg text-sm ${state.rangeKey === key ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${label}</button>`).join('')}
            </div>
            ${state.rangeKey === 'custom' ? `<div class="mt-3 flex flex-wrap items-end gap-2"><label class="text-xs text-slate-500">开始日期<input id="cg-custom-start" type="date" value="${escapeHtml(state.customStart)}" class="block mt-1 px-3 py-2 border border-slate-200 rounded-lg text-sm text-slate-700"></label><label class="text-xs text-slate-500">结束日期<input id="cg-custom-end" type="date" value="${escapeHtml(state.customEnd)}" class="block mt-1 px-3 py-2 border border-slate-200 rounded-lg text-sm text-slate-700"></label><button id="cg-custom-apply" type="button" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm">查询</button></div>` : ''}
            <h2 id="cg-summary-title" class="mt-4 text-sm font-semibold text-brand-700">一句话结论</h2>
            <p class="mt-2 text-lg font-semibold text-slate-900">${sentenceLead}${traceGroupCount.toLocaleString()}条Trace分组，实际发起Provider请求${calls.toLocaleString()}次，${modelSummary}；Provider实际Usage合计${tokenSummary}；平台价格快照直接成本${directCost}（非DeepSeek最终账单）。${evidenceSummary}</p>
            <p class="mt-2 text-sm text-slate-600">三类Token与Reasoning：${usageBreakdown}</p>
            <p class="mt-2 text-xs text-slate-500">统计范围：${escapeHtml(scope.start || '-')} 至 ${escapeHtml(scope.end || '-')} · 时区 ${escapeHtml(scope.timezone || 'Asia/Shanghai')}</p>
            ${qualityPanel}
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mt-4">
              <div class="rounded-xl border border-emerald-200 bg-emerald-50 p-3"><div class="text-xs text-emerald-700">${cardPrefix}平台价格快照直接成本</div><div class="mt-1 text-xl font-semibold text-emerald-800">${directCost}</div><div class="mt-1 text-[10px] text-emerald-700">Provider实际Token换算，非DeepSeek最终账单</div></div>
              <div class="rounded-xl border border-slate-200 bg-slate-50 p-3"><div class="text-xs text-slate-500">${cardPrefix}Trace分组</div><div class="mt-1 text-xl font-semibold text-slate-900">${traceGroupCount.toLocaleString()}条Trace分组</div></div>

              <div class="rounded-xl border p-3 ${attention.tone}"><div class="text-xs">需要关注</div><div class="mt-1 text-lg font-semibold">${attention.label}</div></div>
            </div>
          </section>
        `;
      }

      function renderHighCostTraces() {

      function renderTrends() {
        const items = state.trends || [];

          <div class="bg-white rounded-2xl shadow-soft border border-slate-200 p-4">

                <div class="flex items-center gap-3 text-sm">

                  <div class="w-16 text-right text-slate-700">${Number(i.calls || 0).toLocaleString()}</div>

      function renderDistribution() {
        const items = state.distribution || [];
        if (!items.length) return `<div class="bg-white rounded-2xl shadow-soft border border-slate-200 p-4"><p class="text-sm text-slate-400">暂无分布数据</p></div>`;
        return `
          <div class="bg-white rounded-2xl shadow-soft border border-slate-200 p-4">
            <h3 class="font-semibold text-slate-900 mb-3">${{ model: '模型', agent: 'Agent', intent: '意图', stage: '阶段' }[state.filters.groupBy] || '分布'}</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead><tr class="text-left text-slate-500 text-xs border-b border-slate-100"><th class="pb-2">分组</th><th class="pb-2">Provider请求数</th><th class="pb-2">Provider实际Token</th><th class="pb-2">平台价格快照直接成本（非最终账单）</th></tr></thead>
                <tbody>
                  ${items.map(i => `
                    <tr class="border-b border-slate-50 last:border-0">
                      <td class="py-2">${escapeHtml(i[state.filters.groupBy === 'stage' ? 'stage' : (state.filters.groupBy === 'model' ? 'model_id' : state.filters.groupBy)] || '-')}</td>
                      <td class="py-2">${Number(i.calls || 0).toLocaleString()}</td>
                      <td class="py-2">${fmtTokens(i.tokens)}</td>
                      <td class="py-2">${i.platform_price_snapshot_direct_cost_cny === null || i.platform_price_snapshot_direct_cost_cny === undefined ? `不可得${i.unknown_cost_calls ? `（${i.unknown_cost_calls}次）` : ''}` : fmtCost(i.platform_price_snapshot_direct_cost_cny)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function renderBarChart(items, labelKey, title) {
        if (!items || !items.length) return `<div class="bg-white rounded-2xl shadow-soft border border-slate-200 p-4"><p class="text-sm text-slate-400">暂无${title}数据</p></div>`;
        const maxTokens = Math.max(...items.map(i => i.total_tokens || 0), 1);
        return `
          <div class="bg-white rounded-2xl shadow-soft border border-slate-200 p-4">
            <h3 class="font-semibold text-slate-900 mb-3">${title}</h3>
            <div class="space-y-2 max-h-64 overflow-y-auto">
              ${items.map(i => `
                <div class="flex items-center gap-3 text-sm">
                  <div class="w-28 text-slate-500 shrink-0 truncate" title="${escapeHtml(i[labelKey] || '-')}">${escapeHtml(i[labelKey] || '-')}</div>
                  <div class="flex-1 h-4 bg-slate-100 rounded-full overflow-hidden">
                    <div class="h-full bg-brand-500 rounded-full" style="width: ${Math.min(100, ((i.total_tokens || 0) / maxTokens) * 100)}%"></div>
                  </div>
                  <div class="w-16 text-right text-slate-700">${Number(i.calls || 0).toLocaleString()}</div>
                  <div class="w-20 text-right text-slate-500">${fmtTokens(i.total_tokens)}</div>
                  <div class="w-36 text-right text-xs text-slate-700">
                    ${Number(i.provider_actual_priced_calls || 0) ? `<div class="text-emerald-700">${i.cost_complete ? '平台快照完整直接成本' : '仅已知部分平台快照成本'} ${fmtCost(i.cost_complete ? i.platform_price_snapshot_direct_cost_cny : i.known_partial_provider_actual_cost_cny)}</div>` : ''}
                    ${Number(i.estimated_calls || 0) ? `<div class="text-amber-700">历史估算 ${fmtCost(i.estimated_cost_cny)}（排除Provider actual对账）</div>` : ''}
                    ${Number(i.unavailable_calls || 0) ? `<div class="text-slate-500">${Number(i.unavailable_calls)}次不可计算</div>` : ''}
                    ${!Number(i.calls || 0) ? '<div class="text-slate-400">不适用</div>' : ''}
                    ${Number(i.known_usage_calls || 0) ? `<div class="mt-1 text-[10px] text-slate-500">命中 ${Number(i.input_cache_hit_tokens || 0).toLocaleString()} · 未命中 ${Number(i.input_cache_miss_tokens || 0).toLocaleString()} · 输出 ${Number(i.output_tokens || 0).toLocaleString()} · 推理 ${Number(i.reasoning_known_calls || 0) ? `${Number(i.reasoning_tokens).toLocaleString()}${Number(i.reasoning_unavailable_calls || 0) ? `（另${Number(i.reasoning_unavailable_calls)}次不可得）` : ''}` : '不可得'}（${i.reasoning_is_output_subset === true ? '输出子集' : i.reasoning_is_output_subset === false ? 'Usage矛盾' : '关系待核实'}）</div>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      function renderModelChart() {
        const o = state.overview || {};
        const byModel = o.by_model || {};
        const items = Object.entries(byModel).map(([k, v]) => ({ ...v, model_id: v.model_name || k }));
        return renderBarChart(items, 'model_id', '按模型（Flash / Pro）');
      }

      function renderStageChart() {
        const o = state.overview || {};
        const byStage = o.by_stage || {};
        const stageLabels = {
          router: '路由',
          vertical_agent: '垂直 Agent',
          darwin: 'Darwin 分析',
          ab_test: 'A/B 测试',
          badcase_classify: 'Badcase 分类'
        };
        const items = Object.entries(byStage).map(([k, v]) => ({ ...v, stage: stageLabels[k] || k, stage_key: k }));
        return renderBarChart(items, 'stage', '按阶段');
      }

      function renderTraces() {
        const items = state.traces || [];
        const pagination = state.pagination || {};
        const traceSummary = state.traceSummary || {};
        const traceDataQuality = state.traceDataQuality || {};
        const range = state.traceRange || {};
        const rangeText = (range.start || range.end)
          ? `<span class="text-xs text-slate-500">${escapeHtml(range.start || '')} 至 ${escapeHtml(range.end || '')}</span>`
          : '';
        const rows = items.map(t => {
          const modelIds = (t.models || []).map(model => String(model || '').toLowerCase());
          const hasFlashModel = modelIds.includes('deepseek-v4-flash');
          const hasProModel = modelIds.includes('deepseek-v4-pro');
          const hasUnknownModel = modelIds.some(model => !['deepseek-v4-flash', 'deepseek-v4-pro'].includes(model));
          const modelLabel = t.no_model_calls
            ? '未调用模型'
            : hasUnknownModel
              ? '模型身份待确认'
              : (hasProModel && hasFlashModel ? 'Flash + Pro' : (hasProModel ? 'Pro' : (hasFlashModel ? 'Flash' : '模型身份待确认')));
          const callCount = Number(t.provider_request_count ?? t.model_call_count ?? 0);
          const pendingAttemptCount = Number(t.unconfirmed_provider_attempt_count || 0);
          const operationBadge = t.operation_label
            ? `<span class="inline-flex mt-1 px-2 py-0.5 rounded-full text-[10px] ${t.is_background_task ? 'bg-violet-50 text-violet-700' : 'bg-slate-100 text-slate-600'}">${escapeHtml(t.operation_label)}</span>`
            : '';
          const partialCosts = [
            Number(t.provider_actual_priced_calls || 0) ? `${t.cost_complete ? '平台价格快照完整直接成本' : '仅已知部分平台价格快照成本'} ${fmtCost(t.cost_complete ? t.platform_price_snapshot_direct_cost_cny : t.known_partial_cost_cny)}` : '',
            Number(t.estimated_priced_calls || 0) ? `历史估算 ${fmtCost(t.local_estimated_cost_cny)}，排除Provider actual对账` : '',
            Number(t.unavailable_calls || 0) ? `${Number(t.unavailable_calls)}次直接成本不可得` : '',
          ].filter(Boolean).join('；');
          const costText = t.cost_status === 'not_applicable'
            ? '费用不适用'
            : ['data_quality_error', 'reconciliation_attention'].includes(t.cost_status)
              ? 'Provider attempt存在，但发送/时间/Usage或价格证据无法完整核实（不显示¥0）'
            : t.cost_status === 'partial_unavailable'
              ? partialCosts
              : t.cost_status === 'provider_actual'
                ? `平台价格快照直接成本 ${fmtCost(t.platform_price_snapshot_direct_cost_cny)}（非最终账单）`
                : t.cost_status === 'estimated'
                  ? `本地估算 ${fmtCost(t.local_estimated_cost_cny)}，非账单`
                  : '平台快照直接成本与历史估算分列';
          return `
            <div class="rounded-xl border border-slate-200 p-3 hover:border-brand-200">
              <div class="flex flex-col md:flex-row md:items-center gap-3">
                <div class="min-w-0 flex-1">
                  <div class="font-medium text-slate-900 line-clamp-1">${escapeHtml(t.user_message || t.intent || t.operation_label || '后台分析')}</div>${operationBadge}${Number(t.logical_model_record_count || 0) ? `<div class="mt-1 text-[10px] text-slate-500">另有 ${Number(t.logical_model_record_count)} 条逻辑/历史记录，不计Provider汇总</div>` : ''}${Number(t.anomaly_attempt_count || 0) ? `<div class="mt-1 text-[10px] text-amber-700">${Number(t.anomaly_attempt_count)} 条异常attempt：${escapeHtml((t.anomaly_attempts || []).flatMap(item => item.issue_codes || []).join(' / ') || 'cause_unconfirmed')}；未纳入部分已明确标注排除原因。</div>` : ''}
                  <div class="mt-1 text-[11px] text-slate-400">${fmtTime(t.created_at)} · 辅助编号 ${escapeHtml(t.trace_id)}</div>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs md:w-[520px]">
                  <div><div class="text-slate-400">使用模型</div><div class="mt-0.5 font-medium text-slate-700">${modelLabel}</div></div>
                  <div><div class="text-slate-400">Provider请求次数</div><div class="mt-0.5 font-medium text-slate-700">${t.no_model_calls ? '0次' : `${callCount}次${pendingAttemptCount ? `（另${pendingAttemptCount}条attempt未决）` : ''}`}</div></div>
                  <div><div class="text-slate-400">总Token</div><div class="mt-0.5 font-medium text-slate-700">${t.no_model_calls ? '不适用' : fmtTokens(t.total_tokens)}</div>${t.no_model_calls ? '' : `<div class="mt-1 text-[10px] text-slate-400" title="${t.reasoning_is_output_subset === true ? 'Reasoning属于输出Token子集，不重复计入总量' : t.reasoning_is_output_subset === false ? 'Reasoning与Output关系违反Provider Usage约束' : 'Reasoning与Output关系证据不足'}">命中 ${fmtTokens(t.input_cache_hit_tokens)} · 未命中 ${fmtTokens(t.input_cache_miss_tokens)} · 输出 ${fmtTokens(t.output_tokens)} · 推理 ${Number(t.reasoning_known_calls || 0) ? `${fmtTokens(t.reasoning_tokens)}${Number(t.reasoning_unavailable_calls || 0) ? `（另${Number(t.reasoning_unavailable_calls)}次不可得）` : ''}` : '不可得'}</div>`}</div>
                  <div><div class="text-slate-400">平台快照直接成本</div><div class="mt-0.5 font-medium ${t.cost_status === 'provider_actual' ? 'text-emerald-700' : 'text-slate-700'}">${costText}</div></div>
                </div>
                <button type="button" data-trace="${escapeHtml(t.trace_id)}" class="cg-trace-detail shrink-0 px-3 py-2 bg-brand-50 text-brand-600 rounded-lg text-xs hover:bg-brand-100">查看逐请求对账证据</button>
              </div>
            </div>
          `;
        }).join('');
        return `
          <section class="bg-white rounded-2xl shadow-soft border border-slate-200 p-4" aria-labelledby="cg-records-title">
            <div class="flex flex-wrap items-start justify-between gap-2 mb-3">
              <div><h2 id="cg-records-title" class="font-semibold text-slate-900">调用记录</h2><p class="mt-1 text-xs text-slate-500">每页20条 · ${Number(traceSummary.traceGroupCount ?? pagination.total ?? 0).toLocaleString()}条Trace分组 · ${Number(traceSummary.providerRequestCount || 0).toLocaleString()}次Provider请求</p></div>
              <div class="text-right">${rangeText}<div class="mt-1 text-xs text-slate-400">第${Number(pagination.page || 1)}/${Number(pagination.pages || 1)}页</div></div>
            </div>
            ${state.statisticsConsistent === false ? `<div class="mb-3 rounded-lg border ${traceDataQuality.data_quality_status === 'reconciliation_attention' ? 'border-amber-200 bg-amber-50 text-amber-800' : 'border-red-200 bg-red-50 text-red-700'} px-3 py-2 text-sm font-medium">${traceDataQuality.data_quality_status === 'normal' ? '统计口径异常：顶部汇总与Trace列表的范围或Provider请求数不一致。' : `对账异常：坏时间 ${Number(traceDataQuality.invalid_timestamp_count || 0)}，未决对账 ${Number(traceDataQuality.unresolved_reconciliation_count || 0)}，异常attempt ${Number(traceDataQuality.anomaly_attempt_count || 0)}。`} 请勿按“正常”解读。</div>` : ''}
            <div class="space-y-2">${rows || '<p class="py-4 text-sm text-slate-400">当前范围暂无调用记录。</p>'}</div>
            <div class="mt-4 flex items-center justify-end gap-2">
              <button id="cg-prev-page" type="button" ${pagination.hasPrevious ? '' : 'disabled'} class="px-3 py-1.5 rounded-lg text-sm ${pagination.hasPrevious ? 'bg-slate-100 text-slate-700 hover:bg-slate-200' : 'bg-slate-50 text-slate-300 cursor-not-allowed'}">上一页</button>
              <button id="cg-next-page" type="button" ${pagination.hasNext ? '' : 'disabled'} class="px-3 py-1.5 rounded-lg text-sm ${pagination.hasNext ? 'bg-brand-600 text-white hover:bg-brand-700' : 'bg-slate-50 text-slate-300 cursor-not-allowed'}">下一页</button>
            </div>
            ${renderFilters()}
          </section>
        `;
      }

      async function showTraceDetail(traceId) {
        try {
          const data = await apiGet(`/api/observability/traces/${traceId}/advanced`);
          const trace = data.trace || {};
          const explanation = data.trace_cost_explanation || {};
          const chain = explanation.chain || [];
          const providerAttempts = Array.isArray(data.provider_model_calls)
            ? data.provider_model_calls
            : (Array.isArray(data.model_calls) ? data.model_calls : []);
          const logicalRecords = data.logical_model_records || [];
          const scope = explanation.cost_scope || {};
          const recommendation = explanation.recommendation || {};
          const providerRequestCount = Number(explanation.provider_request_count ?? chain.length);
          const unresolvedProviderAttempts = providerAttempts.filter(call => {
            const reconciliation = call.reconciliation || {};
            return (reconciliation.included_in_provider_summary ?? call.included_in_provider_summary) !== true;
          });
          const unresolvedAttemptCount = unresolvedProviderAttempts.length;
          const noModel = providerRequestCount === 0 && providerAttempts.length === 0;
          const unknownTokenCalls = Number(explanation.unknown_token_calls ?? 0);
          const hasUnavailable = Number(scope.unavailable_calls || 0) > 0 || unknownTokenCalls > 0 || unresolvedAttemptCount > 0;
          const traceDataQualityStatus = data.data_quality_status || (data.data_quality || {}).data_quality_status || 'data_quality_error';
          const stageLabels = { router: '路由判断', agent_selector: 'Agent选择', vertical_agent: '业务回答', darwin: 'AI专家分析', badcase_classify: '问题分类', badcase_extract_knowledge: '提取知识', badcase_switch_model_retry: '切换模型重试', badcase_check_tools: '检查工具', ab_test_a: 'A/B模型A', ab_test_b: 'A/B模型B' };
          const modelLabel = model => String(model || '').toLowerCase() === 'deepseek-v4-pro' ? 'Pro' : (String(model || '').toLowerCase() === 'deepseek-v4-flash' ? 'Flash' : '模型身份待确认');
          const narrativeCalls = providerAttempts.length ? providerAttempts : chain;
          const hasDarwin = narrativeCalls.some(c => c.stage === 'darwin');
          const hasPro = narrativeCalls.some(c => String(c.provider_response_model || c.requested_model || '').toLowerCase() === 'deepseek-v4-pro');
          const agentStageCount = new Set(narrativeCalls.map(c => c.stage || 'unknown')).size;
          const totalTokens = explanation.total_tokens;
          const directCost = scope.platform_price_snapshot_direct_cost_cny;
          const knownPartialCost = scope.known_partial_cost_cny;
          const tokenText = totalTokens === null || totalTokens === undefined
            ? `Provider实际Token不可得（${unknownTokenCalls || providerRequestCount}次，不显示0）`
            : `${Number(totalTokens).toLocaleString()} Provider实际Token${unknownTokenCalls ? `，另${unknownTokenCalls}次不可得` : ''}`;
          const costText = directCost !== null && directCost !== undefined
            ? `平台价格快照直接成本${fmtCost(directCost)}（非DeepSeek最终账单）`
            : knownPartialCost !== null && knownPartialCost !== undefined
              ? `仅已知部分平台价格快照成本${fmtCost(knownPartialCost)}；完整成本不可核实（非DeepSeek最终账单）`
              : '平台价格快照直接成本不可得（不显示¥0）';
          const requestText = `${providerRequestCount}次证据确认且纳入汇总的Provider请求${unresolvedAttemptCount ? `，另${unresolvedAttemptCount}条attempt未决或被排除` : ''}`;
          const selectionText = hasDarwin
            ? 'Pro：仅低频Darwin深度分析，优先复杂分析质量，成本和耗时更高。'
            : hasPro
              ? '本轮Provider实际模型为Pro；该阶段并非Darwin时，以逐请求持久化理由为准。'
              : 'Flash：普通高频业务，控制成本和响应时间；物业事实仍受实际Skill/RAG/MCP/Tool证据约束。';
          const happenedText = hasDarwin
            ? `本轮执行AI专家根因分析，涉及${agentStageCount}个业务阶段，记录${requestText}；${tokenText}；${costText}。`
            : narrativeCalls.some(c => c.stage === 'router') && narrativeCalls.some(c => c.stage === 'vertical_agent')
              ? `为回答这次物业问题，系统先判断由谁处理，再生成业务回答。共${agentStageCount}个业务阶段，记录${requestText}；${tokenText}；${costText}。`
              : `本轮涉及${agentStageCount}个业务阶段，记录${requestText}；${tokenText}；${costText}。`;
          const costRows = chain.length ? chain.map(c => {
            const amount = c.calculated_direct_cost === null || c.calculated_direct_cost === undefined || c.cost_source !== 'platform_price_snapshot'
              ? `不可得（${escapeHtml(c.usage_unavailable_reason || (c.reconciliation || {}).reason || 'cause_unconfirmed')}）`
              : `${fmtCost(c.calculated_direct_cost)}（平台快照）`;
            const sequence = c.provider_request_sequence ? ` · 第${Number(c.provider_request_sequence)}次Provider请求` : '';
            return `<tr class="border-b border-slate-100 last:border-0"><td class="py-2">${escapeHtml(stageLabels[c.stage] || c.stage_name || '模型调用')}${sequence}</td><td class="py-2">${modelLabel(c.provider_response_model || c.requested_model)}</td><td class="py-2">${fmtTokens(c.total_tokens)}</td><td class="py-2">${amount}</td></tr>`;
          }).join('') : '<tr><td colspan="4" class="py-3 text-slate-500">没有可纳入正常成本汇总的请求；异常attempt见高级证据。</td></tr>';
          const technicalCalls = providerAttempts.length
            ? `<div class="space-y-2">${providerAttempts.map(c => renderProviderAttemptCard(c, stageLabels)).join('')}</div>`
            : '<p class="text-sm text-slate-400">没有Provider attempt证据。</p>';
          const normalRecommendation = !recommendation.code || ['normal_observe', 'normal_no_model'].includes(recommendation.code);
          const recommendationHtml = traceDataQualityStatus !== 'normal' || unresolvedAttemptCount > 0
            ? '<p class="text-sm text-amber-800">当前存在数据质量或未决对账异常，请先按高级证据中的attempt、原因码和纳入状态核实，不能按“正常”解释。</p>'
            : normalRecommendation
            ? '<p class="text-sm text-slate-700">当前成本结构正常，暂不需要优化。</p>'
            : `<div class="space-y-1 text-sm text-slate-700"><p><b>为什么值得优化：</b>${escapeHtml(recommendation.why || '-')}</p><p><b>建议改什么：</b>${escapeHtml(recommendation.action || '-')}</p><p><b>预期改善方向：</b>${escapeHtml(recommendation.expected_direction || '-')}</p><p><b>如何同题复测：</b>${escapeHtml(recommendation.retest_method || '使用同一问题、同一配置、同一模型复测，并比较质量、引用、Token、金额和时延。')}</p></div>`;
          const specialHtml = noModel
            ? '<div class="rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-700">本轮没有纳入汇总的Provider请求，因此Provider Token与平台价格快照直接成本不适用；逻辑/历史记录仍在高级证据保留。</div>'
            : unresolvedAttemptCount > 0
              ? `<div class="rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800">已记录${unresolvedAttemptCount}条未决或被排除的Provider attempt；这不等于确认请求已发出，也不进入正常请求、Token或成本汇总。逐条原因和证据见高级区。</div>`
            : hasUnavailable
              ? '<div class="rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-700">本轮存在Provider请求，但至少一次实际Usage或平台价格快照成本不可得；逐条原因和证据见高级区，系统没有按0或估算冒充actual。</div>'
              : '';
          const html = `
            <div class="space-y-4 max-h-[75vh] overflow-y-auto pr-1">
              <div class="text-xs text-slate-400">辅助编号 ${escapeHtml(traceId)} · ${escapeHtml(trace.user_message || trace.intent || '后台操作')}</div>
              ${specialHtml}
              ${noModel ? '' : `
                <section><h4 class="font-semibold text-slate-900 mb-2">1. 本次发生了什么</h4><p class="text-sm text-slate-700">${escapeHtml(happenedText)}</p></section>
                <section><h4 class="font-semibold text-slate-900 mb-2">2. 为什么这样选择</h4><p class="text-sm text-slate-700">${escapeHtml(selectionText)}</p></section>
                <section><h4 class="font-semibold text-slate-900 mb-2">3. 平台直接成本怎么来的</h4><p class="mb-2 text-xs text-slate-500">人民币金额 = Provider实际Token × 平台冻结价格快照；不是DeepSeek最终账单。</p><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-xs text-slate-500 border-b border-slate-200"><th class="pb-2">环节</th><th class="pb-2">模型</th><th class="pb-2">Provider实际Token</th><th class="pb-2">平台快照直接成本</th></tr></thead><tbody>${costRows}</tbody></table></div></section>
                <section class="rounded-xl border border-indigo-200 bg-indigo-50 p-3"><h4 class="font-semibold text-slate-900 mb-2">4. 下一步建议</h4>${recommendationHtml}</section>
              `}
              <details class="rounded-xl border border-slate-200 bg-slate-50 p-3"><summary class="cursor-pointer font-medium text-slate-700">高级证据：逐请求对账、逻辑聚合与历史记录</summary><div class="mt-3">${technicalCalls}</div><div class="mt-4"><h5 class="font-medium text-slate-800 mb-2">逻辑聚合/历史记录</h5>${renderLogicalModelRecords(logicalRecords)}</div></details>
            </div>
          `;
          openModal('调用记录详情', html, null, '关闭');
        } catch (err) {
          showToast('加载调用记录详情失败', 'error');
        }
      }

      function renderProviderUsageSummary() {
        const summary = state.usageSummary || {};
        const rows = Array.isArray(summary.rows) ? summary.rows : [];
        const byModel = Object.fromEntries(rows.map(row => [row.actual_model, row]));
        const emptyRow = (actualModel, label) => ({
          actual_model: actualModel,
          model_label: label,
          provider_request_count: null,
          cache_hit_input_tokens: null,
          cache_miss_input_tokens: null,
          output_tokens: null,
          total_tokens: null,
          usage_complete: false,
        });
        const displayRows = [
          byModel['deepseek-v4-flash'] || emptyRow('deepseek-v4-flash', 'Flash'),
          byModel['deepseek-v4-pro'] || emptyRow('deepseek-v4-pro', 'Pro'),

          const providerTotalRow = requests.length ? `<tr class="border-t-2 border-slate-200 bg-slate-50 font-medium text-slate-800"><td class="px-2 py-2">Trace合计</td><td class="px-2 py-2" colspan="3">${traceRecordedValue(providerSummary.provider_request_count, ' 次物理请求')}</td><td class="px-2 py-2 text-right">${traceRecordedValue(providerUsage.cache_hit_input_tokens)}</td><td class="px-2 py-2 text-right">${traceRecordedValue(providerUsage.cache_miss_input_tokens)}</td><td class="px-2 py-2 text-right">${traceRecordedValue(providerUsage.input_tokens)}</td><td class="px-2 py-2 text-right">${traceRecordedValue(providerUsage.output_tokens)}</td><td class="px-2 py-2 text-right">${traceRecordedValue(providerUsage.reasoning_tokens)}</td><td class="px-2 py-2 text-right">${traceRecordedValue(providerUsage.total_tokens)}</td><td class="px-2 py-2 text-right">${providerTotalCost}</td><td class="px-2 py-2 text-right">—</td><td class="px-2 py-2">${providerSummary.complete === true ? '完整' : '部分不可得'}</td></tr>` : '';
          const modelReasons = models.length ? models.map(item => `<li>${escapeHtml(item.stage || '模型请求')}：请求 ${escapeHtml(item.requested_model || '未记录')}，Provider实际 ${escapeHtml(item.provider_actual_model || '未记录')}，Thinking ${item.thinking_enabled === null || item.thinking_enabled === undefined ? '未记录' : (item.thinking_enabled ? '开启' : '关闭')}；理由：${escapeHtml(traceModelSelectionReason(item.stage, item.requested_model, item.provider_actual_model, item.reason || item.model_selection_reason || ''))}</li>`).join('') : '<li>本轮未调用Provider。</li>';
          const toolStatuses = Array.isArray(quality.tool_statuses) && quality.tool_statuses.length ? quality.tool_statuses.map(item => `${item.server || '—'}/${item.tool || '—'}=${item.status || '—'}`).join('；') : '无实际调用';
          const breakdownValues = [providerSummary.provider_request_count, calls.router_requests, calls.agent_requests, calls.second_agent_requests, calls.other_provider_requests];

          const providerBreakdownText = simpleChatBreakdown

            <section class="rounded-xl border border-cyan-200 bg-cyan-50 p-4"><h4 class="font-semibold text-cyan-950">本轮成本与质量控制</h4><div class="mt-3 grid gap-3 md:grid-cols-2 text-xs text-cyan-950"><div class="rounded-lg bg-white/70 p-3"><div class="font-medium">Provider请求构成</div><p class="mt-1">${providerBreakdownText}；其中同Agent能力续答 ${traceRecordedValue(calls.tool_follow_up_requests)} 次${simpleChatBreakdown ? `；第二Agent ${traceRecordedValue(calls.second_agent_requests)} 次` : ''}；重试 ${traceRecordedValue(calls.automatic_retries)} 次。</p><p class="mt-1 text-cyan-700">按需读取Skill或调用MCP/Tool后，同一个Agent需要再次基于结果回答，因此可能多一次Provider请求，不代表换Agent。</p></div><div class="rounded-lg bg-white/70 p-3"><div class="font-medium">能力与RAG</div><p class="mt-1">Skill已使用 ${traceRecordedValue(loading.skill_used_count)} 项（绑定 ${traceRecordedValue(loading.skill_bound_count)} 项）；MCP实际调用 ${traceRecordedValue(loading.mcp_call_count)} 次；业务Tool实际调用 ${traceRecordedValue(loading.business_tool_call_count)} 次；Tool schema暴露 ${traceRecordedValue(loading.tool_schema_exposed_count)} 项。</p><p class="mt-1">RAG装载 ${traceRecordedValue(loading.rag_loaded_chunk_count)} 个分片；回答实际采用 ${traceRecordedValue(quality.rag_citation_used_count)} 条RAG Citation；装载字符 ${traceRecordedValue(loading.rag_loaded_characters)}。</p><p class="mt-1 text-cyan-700">Provider Input Token是权威总量；组件仅展示数量和字符，不伪装精确Token拆分。</p></div><div class="rounded-lg bg-white/70 p-3"><div class="font-medium">质量依据</div><p class="mt-1">answer_status=${escapeHtml(String(quality.answer_status || '历史Trace未记录'))}；Citation=${escapeHtml(String(quality.citation_validation || '历史Trace未记录'))}；MCP=${escapeHtml(toolStatuses)}；Proposal=${escapeHtml(String(quality.proposal_status || '不适用'))}；人工评价=${escapeHtml(String(quality.human_evaluation || '尚未评价'))}。</p></div><div class="rounded-lg bg-white/70 p-3"><div class="font-medium">模型选择</div><ul class="mt-1 list-disc list-inside space-y-1">${modelReasons}</ul></div></div></section>
